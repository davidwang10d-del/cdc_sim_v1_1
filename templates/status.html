<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CDC Sim Status</title>
    <style>
        :root { color-scheme: dark; font-family: "Segoe UI", Arial, sans-serif; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; background:#050a0f; color:#c9d1d9; }
        main { width:min(680px, calc(100vw - 40px)); background:#0d1117; border:1px solid #30363d; border-radius:10px; padding:24px; box-shadow:0 18px 60px #0008; }
        h1 { margin:0 0 6px; color:#fff; font-size:24px; }
        .sub { color:#8b949e; margin-bottom:20px; }
        .summary { border:1px solid #30363d; border-left:4px solid #e3b341; background:#010409; padding:14px; border-radius:6px; margin-bottom:14px; }
        .summary.ok { border-left-color:#2ea043; }
        .summary.error { border-left-color:#f85149; }
        .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px; }
        .card { border:1px solid #30363d; background:#010409; padding:12px; border-radius:6px; }
        .label { color:#8b949e; font-size:12px; margin-bottom:4px; }
        .value { color:#fff; overflow-wrap:anywhere; }
        ul { margin:8px 0 0; padding-left:20px; }
        a, button { display:inline-block; margin-top:18px; margin-right:8px; color:#fff; background:#1f6feb; border:1px solid #58a6ff; border-radius:5px; padding:8px 12px; text-decoration:none; cursor:pointer; }
        button { background:#21262d; border-color:#8b949e; }
    </style>
</head>
<body>
<main>
    <h1>CDC Sim readiness check</h1>
    <div class="sub">A quick pre-committee check of the local server, dependencies, and scenario packages.</div>
    <div id="summary" class="summary">Checking the simulator…</div>
    <div class="grid">
        <div class="card"><div class="label">Python</div><div id="python" class="value">—</div></div>
        <div class="card"><div class="label">Environment</div><div id="venv" class="value">—</div></div>
        <div class="card"><div class="label">DLC packages</div><div id="dlcs" class="value">—</div></div>
    </div>
    <div id="details"></div>
    <a href="/">Open dashboard</a><button type="button" onclick="runCheck()">Check again</button>
</main>
<script>
async function runCheck() {
    const summary = document.getElementById('summary');
    summary.className = 'summary';
    summary.textContent = 'Checking the simulator…';
    try {
        const [healthResponse, dlcResponse] = await Promise.all([fetch('/api/health'), fetch('/api/list_dlcs')]);
        if (!healthResponse.ok || !dlcResponse.ok) throw new Error('The status API did not respond correctly.');
        const health = await healthResponse.json();
        const dlcs = await dlcResponse.json();
        const missing = Object.entries(health.packages || {}).filter(([, installed]) => !installed).map(([name]) => name);
        const invalid = dlcs.filter(dlc => !dlc.valid);
        const ready = health.status === 'ok' && missing.length === 0 && dlcs.some(dlc => dlc.valid) && invalid.length === 0;
        summary.className = `summary ${ready ? 'ok' : 'error'}`;
        summary.textContent = ready ? 'Ready for committee use.' : 'Attention is needed before committee starts.';
        document.getElementById('python').textContent = health.python || 'Unknown';
        document.getElementById('venv').textContent = health.venv || 'Unknown';
        document.getElementById('dlcs').textContent = `${dlcs.filter(dlc => dlc.valid).length} ready, ${invalid.length} invalid`;
        const messages = [];
        if (missing.length) messages.push(`Missing packages: ${missing.join(', ')}`);
        if (!dlcs.some(dlc => dlc.valid)) messages.push('No valid DLC package is available.');
        invalid.forEach(dlc => messages.push(`${dlc.name}: ${(dlc.errors || []).join('; ')}`));
        const details = document.getElementById('details');
        details.replaceChildren();
        if (messages.length) {
            const list = document.createElement('ul');
            messages.forEach(message => { const item = document.createElement('li'); item.textContent = message; list.appendChild(item); });
            details.appendChild(list);
        }
    } catch (error) {
        summary.className = 'summary error';
        summary.textContent = `Status check failed: ${error.message}`;
    }
}
runCheck();
</script>
</body>
</html>
