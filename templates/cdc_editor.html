<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CDC DLC Builder</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <style>
        body { margin:0; background:#050a0f; color:#c9d1d9; font-family:"Segoe UI", Arial, sans-serif; overflow:hidden; user-select:text; }
        #header { height:58px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; background:#0d1117; border-bottom:1px solid #30363d; }
        #workspace { display:grid; grid-template-columns:260px 1fr; height:calc(100vh - 59px); }
        #sidebar { background:#0d1117; border-right:1px solid #30363d; padding:12px; overflow-y:auto; }
        #content { overflow-y:auto; padding:22px; }
        .nav-btn { width:100%; text-align:left; margin-bottom:7px; padding:10px; border:1px solid #30363d; background:#010409; color:#c9d1d9; border-radius:4px; cursor:pointer; }
        .nav-btn.active { border-color:#58a6ff; color:#58a6ff; background:#1f6feb20; }
        .section { border:1px solid #30363d; background:#0d1117; border-radius:6px; padding:16px; margin-bottom:16px; }
        .section h2 { margin:0 0 10px; color:#58a6ff; font-size:18px; }
        .hint { color:#8b949e; font-size:12px; line-height:1.45; margin-bottom:12px; }
        .grid { display:grid; grid-template-columns:repeat(2, minmax(220px, 1fr)); gap:12px; }
        .grid.three { grid-template-columns:repeat(3, minmax(180px, 1fr)); }
        label { color:#8b949e; font-size:12px; font-weight:600; display:block; margin-bottom:4px; }
        input, select, textarea { width:100%; box-sizing:border-box; background:#010409; color:#c9d1d9; border:1px solid #30363d; border-radius:4px; padding:8px; font-family:inherit; }
        textarea { min-height:76px; resize:vertical; }
        .btn { border:1px solid #2ea043; background:#238636; color:#fff; border-radius:4px; padding:8px 12px; cursor:pointer; font-weight:600; }
        .btn.secondary { background:#1f6feb; border-color:#58a6ff; }
        .btn.warn { background:#9a6700; border-color:#e3b341; }
        .btn.danger { background:#da3633; border-color:#f85149; }
        .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
        .card { border:1px solid #30363d; background:#010409; padding:12px; border-radius:5px; margin-bottom:10px; }
        .card-title { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
        .small { font-size:12px; color:#8b949e; }
        .pill { display:inline-block; border:1px solid #30363d; border-radius:999px; padding:2px 8px; margin:2px; color:#8b949e; font-size:11px; }
        .zh-only { display:none; }
        body.zh .en-only { display:none; }
        body.zh .zh-only { display:inline; }
    </style>
</head>
<body>
<div id="header">
    <div>
        <div style="font-size:20px; font-weight:700; color:#fff;">CDC DLC Builder <span class="zh-only">/ 剧本生成器</span></div>
        <div class="small">No-code scenario package creator for MUN chairs / 面向主席团的无代码剧本工具</div>
    </div>
    <div class="toolbar" style="margin:0;">
        <button class="btn secondary" onclick="toggleLanguage()">EN / 中文</button>
        <button class="btn warn" onclick="loadTemplate('crisis')">Load Crisis Template</button>
        <button class="btn secondary" onclick="validateDlc()">Check Package</button>
        <button class="btn" onclick="exportAll()">Export DLC Zip</button>
    </div>
</div>

<div id="workspace">
    <div id="sidebar">
        <button class="nav-btn active" onclick="switchTab('start', this)">1. Start / 开始</button>
        <button class="nav-btn" onclick="switchTab('scenario', this)">2. Scenario & Map / 剧本地图</button>
        <button class="nav-btn" onclick="switchTab('rules', this)">3. Simulation Rules / 推演规则</button>
        <button class="nav-btn" onclick="switchTab('committee', this)">4. Committee / 委员会</button>
        <button class="nav-btn" onclick="switchTab('diplomacy', this)">5. Diplomacy / 外交阵营</button>
        <button class="nav-btn" onclick="switchTab('units', this)">6. Units / 部队</button>
        <button class="nav-btn" onclick="switchTab('battalions', this)">7. Battalion Types / 营种</button>
        <button class="nav-btn" onclick="switchTab('weapons', this)">8. Weapons / 武器</button>
        <button class="nav-btn" onclick="switchTab('installations', this)">9. Military Targets / 军事目标</button>
        <button class="nav-btn" onclick="switchTab('export', this)">10. Export / 导出</button>
    </div>
    <div id="content"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
let db = null;

let currentTab = "start";
let mapFiles = { dem: [], roads: null, rivers: null, provinces: null };

function byId(id) { return document.getElementById(id); }
function esc(value) { return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;"); }
function n(value, fallback=0) { const parsed = parseFloat(value); return Number.isFinite(parsed) ? parsed : fallback; }
function validId(value) { return /^[A-Za-z0-9_][A-Za-z0-9_.-]{0,63}$/.test(value || ""); }
function switchTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
    if (btn) btn.classList.add("active");
    render();
}
function toggleLanguage() { document.body.classList.toggle("zh"); }
function setPath(obj, path, value) {
    const parts = path.split(".");
    let target = obj;
    while (parts.length > 1) target = target[parts.shift()];
    target[parts[0]] = value;
}
function input(label, path, value, type="text", step="") {
    const sync = path.startsWith("rules.") ? "; syncRulesJson()" : "";
    return `<div><label>${label}</label><input type="${type}" ${step ? `step="${step}"` : ""} value="${esc(value)}" onchange="setPath(db, '${path}', this.type==='number' ? n(this.value) : this.value)${sync}"></div>`;
}
function textarea(label, path, value) {
    return `<div style="grid-column:1/-1;"><label>${label}</label><textarea onchange="setPath(db, '${path}', this.value)">${esc(value)}</textarea></div>`;
}
function render() {
    if (!db) {
        byId("content").innerHTML = `<div class="section"><h2>Loading DLC starter package…</h2></div>`;
        return;
    }
    const renders = { start: renderStart, scenario: renderScenario, rules: renderRules, committee: renderCommittee, diplomacy: renderDiplomacy, units: renderUnits, battalions: renderBattalions, weapons: renderWeapons, installations: renderInstallations, export: renderExport };
    byId("content").innerHTML = renders[currentTab]();
}

function renderStart() {
    return `<div class="section">
        <h2>Chair-Friendly DLC Builder <span class="zh-only">/ 主席团无代码 DLC 生成器</span></h2>
        <p class="hint">Fill the tabs from top to bottom. Export creates battle data and special simulation rules that run on the simulator's shared command doctrine.</p>
        <div class="grid">
            <div class="card"><b>1. Scenario & Map</b><p class="small">Name the committee and define map bounds.</p></div>
            <div class="card"><b>2. Simulation Rules</b><p class="small">Tune clock, readiness, detection, aircraft types, combat missions, and political influence.</p></div>
            <div class="card"><b>3. Committee</b><p class="small">Add delegate roles, procedure, victory conditions, and staff notes.</p></div>
            <div class="card"><b>4. Diplomacy</b><p class="small">Group factions that start as allies.</p></div>
            <div class="card"><b>5. Units</b><p class="small">Place battle units using DLC-defined types and core combat stances.</p></div>
            <div class="card"><b>6. Battalion Types</b><p class="small">Define defense, armor generation, logistics, capabilities, and mounted weapon groups.</p></div>
            <div class="card"><b>7. Weapons</b><p class="small">Define weapon generation, mission roles, and attack/penetration values for every range band.</p></div>
            <div class="card"><b>8. Military Targets</b><p class="small">Place forts, radar sites, and construction projects. Type effects remain DLC rules.</p></div>
        </div>
        <div class="section"><h2>Map File Rules</h2>
        <p class="hint">Optional map files can be attached in Scenario & Map. DEM files are placed in <code>maps/dem_tiles</code>. Roads, rivers, and province files are placed in <code>maps</code>.</p></div>
    </div>`;
}

function renderScenario() {
    const s = db.scenario, b = s.map_config.bounds;
    if (!Array.isArray(s.cities)) s.cities = [];
    if (!Array.isArray(s.province_politics)) s.province_politics = [];
    return `<div class="section"><h2>Scenario & Map / 剧本与地图</h2>
        <div class="grid">
            ${input("Scenario Name / 剧本名称", "scenario.scenario_name", s.scenario_name)}
            ${input("Description / 简介", "scenario.description", s.description)}
            ${input("Map Center Latitude / 地图中心纬度", "scenario.map_center.0", s.map_center[0], "number", "0.001")}
            ${input("Map Center Longitude / 地图中心经度", "scenario.map_center.1", s.map_center[1], "number", "0.001")}
            ${input("Map Zoom / 地图缩放", "scenario.map_zoom", s.map_zoom, "number", "1")}
            ${input("Grid Width / 网格宽", "scenario.map_config.grid_resolution.0", s.map_config.grid_resolution[0], "number", "1")}
            ${input("Grid Height / 网格高", "scenario.map_config.grid_resolution.1", s.map_config.grid_resolution[1], "number", "1")}
            ${input("DEM Analysis Width / 高程分析宽", "scenario.map_config.dem_analysis_resolution.0", s.map_config.dem_analysis_resolution?.[0] || 1200, "number", "1")}
            ${input("DEM Analysis Height / 高程分析高", "scenario.map_config.dem_analysis_resolution.1", s.map_config.dem_analysis_resolution?.[1] || 1200, "number", "1")}
            ${input("Min Lon / 最小经度", "scenario.map_config.bounds.min_lon", b.min_lon, "number", "0.001")}
            ${input("Max Lon / 最大经度", "scenario.map_config.bounds.max_lon", b.max_lon, "number", "0.001")}
            ${input("Min Lat / 最小纬度", "scenario.map_config.bounds.min_lat", b.min_lat, "number", "0.001")}
            ${input("Max Lat / 最大纬度", "scenario.map_config.bounds.max_lat", b.max_lat, "number", "0.001")}
            ${input("Province Name Property / 省名字段", "scenario.map_config.province_name_property", s.map_config.province_name_property || "")}
            ${input("Fallback Elevation m / 默认海拔", "scenario.map_config.fallback_elevation_m", s.map_config.fallback_elevation_m ?? 0, "number", "1")}
        </div>
    </div>
    <div class="section"><h2>Optional Map Files / 可选地图文件</h2>
        <p class="hint">You may export a playable DLC without map files. The simulator will use fallback terrain. For serious committees, add DEM/province/road files.</p>
        <div class="grid">
            <div><label>DEM tiles (.tif, multiple) / 高程瓦片</label><input type="file" multiple accept=".tif,.tiff" onchange="mapFiles.dem = Array.from(this.files)"></div>
            <div><label>Road raster/vector / 道路文件</label><input type="file" accept=".tif,.tiff,.geojson,.json" onchange="mapFiles.roads = this.files[0] || null"></div>
            <div><label>River geojson / 河流文件</label><input type="file" accept=".geojson,.json" onchange="mapFiles.rivers = this.files[0] || null"></div>
            <div><label>Province geojson / 省界文件</label><input type="file" accept=".geojson,.json" onchange="mapFiles.provinces = this.files[0] || null"></div>
        </div>
    </div>
    ${renderCities()}
    ${renderProvincePolitics()}`;
}

function renderCities() {
    const cities = db.scenario.cities;
    return `<div class="section"><h2>City Influence Areas / 城市影响区</h2>
        <p class="hint">Cities affect every army inside their circular area through the existing terrain, cover, frontage, concealment, movement, and fatigue systems. Influence 0 has no effect; 1 represents maximum major-city complexity (for example, New York). Overlapping areas use the strongest influence.</p>
        <div class="toolbar"><button class="btn secondary" onclick="addCity()">Add City / 添加城市</button></div>
        ${cities.length ? cities.map((city, i) => `<div class="card">
            <div class="card-title"><b>${esc(city.name || "New City")} <span class="pill">${esc(city.id)}</span></b><button class="btn danger" onclick="db.scenario.cities.splice(${i},1); render()">Delete</button></div>
            <div class="grid three">
                ${cityInput(i, "id", city.id, "City ID / 城市 ID")}
                ${cityInput(i, "name", city.name, "Name / 名称")}
                ${cityInput(i, "description", city.description || "", "City Info / 城市信息")}
                ${cityInput(i, "lon", city.lon, "Longitude / 经度", "number", "0.001", "-180", "180")}
                ${cityInput(i, "lat", city.lat, "Latitude / 纬度", "number", "0.001", "-90", "90")}
                ${cityInput(i, "area_km2", city.area_km2 ?? 0, "Area km² / 面积", "number", "0.1", "0")}
                ${cityInput(i, "influence_rate", city.influence_rate ?? 0, "Influence Rate 0–1 / 影响率", "number", "0.01", "0", "1")}
            </div>
        </div>`).join("") : '<div class="card small">No cities configured. The default city influence is 0.</div>'}
    </div>`;
}

function cityInput(index, key, value, label, type="text", step="", min="", max="") {
    return `<div><label>${label}</label><input type="${type}" ${step ? `step="${step}"` : ""} ${min !== "" ? `min="${min}"` : ""} ${max !== "" ? `max="${max}"` : ""} value="${esc(value)}" onchange="db.scenario.cities[${index}].${key}=this.type==='number'?n(this.value):this.value"></div>`;
}

function addCity() {
    const center = db.scenario.map_center || [0, 0];
    const used = new Set(db.scenario.cities.map(city => city.id));
    let suffix = db.scenario.cities.length + 1;
    while (used.has(`city_${suffix}`)) suffix++;
    db.scenario.cities.push({
        id: `city_${suffix}`,
        name: "New City",
        description: "",
        lon: n(center[1], 0),
        lat: n(center[0], 0),
        area_km2: 0,
        influence_rate: 0
    });
    render();
}

function renderProvincePolitics() {
    const entries = db.scenario.province_politics;
    return `<div class="section"><h2>Province Politics / 省份政治</h2>
        <p class="hint">Create one record per province and faction. Civilian sentiment ranges from −1 (maximum opposition), through 0 (indifferent/neutral, the default), to +1 (maximum support). Initial occupation ranges from 0 to 1; military presence changes occupation during play.</p>
        <div class="toolbar"><button class="btn secondary" onclick="addProvincePolitics()">Add Province-Faction Record / 添加省份阵营</button></div>
        ${entries.length ? entries.map((entry, i) => `<div class="card">
            <div class="card-title"><b>${esc(entry.province || "Province")} · ${esc(entry.faction || "Faction")}</b><button class="btn danger" onclick="db.scenario.province_politics.splice(${i},1); render()">Delete</button></div>
            <div class="grid">
                ${politicsInput(i, "province", entry.province, "Province Name / 省份名称")}
                ${politicsInput(i, "faction", entry.faction, "Faction / 阵营")}
                ${politicsInput(i, "civilian_sentiment", entry.civilian_sentiment ?? 0, "Civilian Sentiment −1 to +1 / 民意", "number", "0.01", "-1", "1")}
                ${politicsInput(i, "occupation", entry.occupation ?? 0, "Initial Occupation 0–1 / 初始占领", "number", "0.01", "0", "1")}
            </div>
        </div>`).join("") : '<div class="card small">No authored tendencies. Every province-faction relationship defaults to neutral sentiment (0) and no occupation (0).</div>'}
    </div>`;
}

function politicsInput(index, key, value, label, type="text", step="", min="", max="") {
    return `<div><label>${label}</label><input type="${type}" ${step ? `step="${step}"` : ""} ${min !== "" ? `min="${min}"` : ""} ${max !== "" ? `max="${max}"` : ""} value="${esc(value)}" onchange="db.scenario.province_politics[${index}].${key}=this.type==='number'?n(this.value):this.value"></div>`;
}

function addProvincePolitics() {
    const faction = db.scenario.committee?.delegate_roles?.[0]?.faction || "FACTION";
    db.scenario.province_politics.push({
        province: "Province Name",
        faction,
        civilian_sentiment: 0,
        occupation: 0
    });
    render();
}

function renderRules() {
    const r = db.rules;
    const stanceNames = Object.values(db.doctrine.stances).map(profile => profile.label).join(", ");
    const orderNames = Object.values(db.doctrine.orders.modes).map(profile => profile.label).join(", ");
    return `<div class="section"><h2>Simulation Rules / 推演规则</h2>
        <p class="hint">These are scenario-specific values. Aircraft types and their sortie factors belong here. Tactical orders, combat stances, and their interaction are shared core doctrine and are not duplicated in a DLC.</p>
        <div class="card"><b>Core doctrine (read only)</b><p class="small">Orders: ${esc(orderNames)}</p><p class="small">Stances: ${esc(stanceNames)}</p></div>
        <div class="grid three">
            ${input("Game seconds per real second", "rules.clock.game_seconds_per_real_second", r.clock.game_seconds_per_real_second, "number", "0.1")}
            ${input("Minimum speed multiplier", "rules.clock.speed_multiplier_min", r.clock.speed_multiplier_min, "number", "0.1")}
            ${input("Maximum speed multiplier", "rules.clock.speed_multiplier_max", r.clock.speed_multiplier_max, "number", "0.1")}
            ${input("Detection probability scale", "rules.detection.probability_scale", r.detection.probability_scale, "number", "0.1")}
            ${input("Contact memory hours", "rules.detection.contact_ttl_hours", r.detection.contact_ttl_hours, "number", "0.1")}
            ${input("Direct combat attack scale", "rules.combat.direct.attack_scale", r.combat.direct.attack_scale, "number", "0.01")}
            ${input("Bombard casualty coefficient", "rules.missions.bombard.casualty_coefficient", r.missions.bombard.casualty_coefficient, "number", "0.0001")}
            ${input("Bombard unobserved accuracy", "rules.missions.bombard.unobserved_accuracy_multiplier", r.missions.bombard.unobserved_accuracy_multiplier, "number", "0.05")}
            ${input("Airstrike casualty coefficient", "rules.missions.airstrike.casualty_coefficient", r.missions.airstrike.casualty_coefficient, "number", "0.01")}
            ${input("Airstrike sortie range (km)", "rules.missions.airstrike.sortie_range_km", r.missions.airstrike.sortie_range_km, "number", "10")}
            ${input("Airstrike unobserved accuracy", "rules.missions.airstrike.unobserved_accuracy_multiplier", r.missions.airstrike.unobserved_accuracy_multiplier, "number", "0.05")}
            ${input("Occupation gain per hour", "rules.political_influence.occupation_gain_per_hour", r.political_influence.occupation_gain_per_hour, "number", "0.01")}
            ${input("Occupation decay per hour", "rules.political_influence.occupation_decay_per_hour", r.political_influence.occupation_decay_per_hour, "number", "0.01")}
            ${input("Control threshold", "rules.political_influence.control_threshold", r.political_influence.control_threshold, "number", "0.01")}
            ${input("Control margin", "rules.political_influence.control_margin", r.political_influence.control_margin, "number", "0.01")}
            ${input("Contested threshold", "rules.political_influence.contested_threshold", r.political_influence.contested_threshold, "number", "0.01")}
        </div>
    </div>
    <div class="section"><h2>Advanced Rules JSON</h2>
        <p class="hint">Edit the DLC contract here to add battle-specific unit types, aircraft profiles, capabilities, or detailed coefficients. Each aircraft profile must keep every factor from the template. Core orders and stances cannot be overridden.</p>
        <textarea id="rules-json" style="min-height:520px; font-family:Consolas, monospace;">${esc(JSON.stringify(r, null, 2))}</textarea>
        <div class="toolbar" style="margin-top:10px;"><button class="btn secondary" onclick="applyRulesJson()">Apply Advanced JSON</button></div>
    </div>`;
}

function syncRulesJson() {
    const editor = byId("rules-json");
    if (editor) editor.value = JSON.stringify(db.rules, null, 2);
}

function applyRulesJson() {
    try {
        const parsed = JSON.parse(byId("rules-json").value);
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) throw new Error("Rules root must be an object.");
        if (parsed.schema_version !== 1) throw new Error("schema_version must be 1.");
        const requiredObjects = ["clock", "unit_defaults", "unit_types", "detection", "combat", "missions", "political_influence"];
        for (const key of requiredObjects) {
            if (!parsed[key] || typeof parsed[key] !== "object" || Array.isArray(parsed[key])) throw new Error(`Missing required object: ${key}`);
        }
        if (parsed.orders || parsed.stances) throw new Error("orders and stances belong to core doctrine and must not be stored in rules.json.");
        if (!parsed.combat.direct || !parsed.missions.bombard || !parsed.missions.airstrike) throw new Error("Combat and mission rule sections are incomplete.");
        if (!parsed.missions.airstrike.aircraft_types?.[parsed.missions.airstrike.default_aircraft_type]) throw new Error("Airstrike rules require aircraft_types and a valid default_aircraft_type.");
        db.rules = parsed;
        alert("Rules JSON applied. Run Check Package before export.");
        render();
    } catch (error) {
        alert("Rules JSON rejected: " + error.message);
    }
}

function renderCommittee() {
    const c = db.scenario.committee;
    return `<div class="section"><h2>Committee Settings / 委员会设置</h2><div class="grid">
        ${input("Committee Name / 委员会名称", "scenario.committee.committee_name", c.committee_name)}
        ${input("Committee Type / 委员会类型", "scenario.committee.committee_type", c.committee_type)}
        ${input("Simulation Scope / 推演范围", "scenario.committee.simulation_scope", c.simulation_scope)}
        ${input("Start Date or Turn / 起始日期", "scenario.committee.start_date", c.start_date)}
        ${input("Chair Visibility / 主席可见性", "scenario.committee.chair_visibility", c.chair_visibility)}
        ${input("Delegate Visibility / 代表可见性", "scenario.committee.delegate_visibility", c.delegate_visibility)}
        ${textarea("Public Briefing / 公开背景", "scenario.committee.public_briefing", c.public_briefing)}
        ${textarea("Staff Notes / 主席团私密备注", "scenario.committee.staff_notes", c.staff_notes)}
    </div></div>
    ${renderStringList("Rules of Engagement / 议事与交战规则", c.rules_of_engagement, "rules_of_engagement")}
    ${renderStringList("Victory Conditions / 胜利目标", c.victory_conditions, "victory_conditions")}
    ${renderRoles()}`;
}

function renderStringList(title, list, key) {
    return `<div class="section"><h2>${title}</h2><div class="toolbar"><button class="btn secondary" onclick="db.scenario.committee.${key}.push('New item'); render()">Add</button></div>
        ${list.map((item, i) => `<div class="card"><div class="grid"><input value="${esc(item)}" onchange="db.scenario.committee.${key}[${i}] = this.value"><button class="btn danger" onclick="db.scenario.committee.${key}.splice(${i},1); render()">Delete</button></div></div>`).join("")}
    </div>`;
}

function renderRoles() {
    const roles = db.scenario.committee.delegate_roles;
    return `<div class="section"><h2>Delegate Roles / 代表角色</h2><div class="toolbar"><button class="btn secondary" onclick="rolesAdd()">Add Role</button></div>
        ${roles.map((r, i) => `<div class="card"><div class="card-title"><b>${esc(r.faction || "Faction")}</b><button class="btn danger" onclick="db.scenario.committee.delegate_roles.splice(${i},1); render()">Delete</button></div>

function renderUnitCard(id, u) {
    const stanceOptions = Object.entries(db.doctrine.stances).map(([v, profile]) => `<option value="${v}" ${u.stance===v?"selected":""}>${esc(profile.label || v)}</option>`).join("");
    const typeOptions = Object.entries(db.rules.unit_types).map(([v, profile]) => `<option value="${v}" ${u.unit_type===v?"selected":""}>${esc(profile.label || v)}</option>`).join("");
    const aircraftTypes = db.rules.missions?.airstrike?.aircraft_types || {};
    const selectedAircraftType = u.aircraft_type || db.rules.missions?.airstrike?.default_aircraft_type || "";
    const aircraftOptions = Object.entries(aircraftTypes).map(([v, profile]) => `<option value="${v}" ${selectedAircraftType===v?"selected":""}>${esc(profile.label || v)} — ${esc(profile.attack_profile || "")}</option>`).join("");
    const unitCapabilities = db.rules.unit_types?.[u.unit_type]?.capabilities || [];
    const hasAirstrike = unitCapabilities.includes(db.rules.missions?.airstrike?.capability);
    const aircraftField = hasAirstrike
        ? `<div><label>Aircraft Type / 飞机类型</label><select onchange="db.units['${id}'].aircraft_type=this.value">${aircraftOptions}</select></div>`
        : "";
    const comp = Object.keys(db.battalions).map(b => `<div><label>${db.battalions[b].name} (${b})</label><input type="number" value="${u.composition?.[b] || 0}" onchange="setComp('${id}','${b}', n(this.value))"></div>`).join("");
    const mountedWeapons = {};
    for (const [battalionId, count] of Object.entries(u.composition || {})) {
        for (const [weaponId, quantity] of Object.entries(db.battalions[battalionId]?.weapons || {})) {
            mountedWeapons[weaponId] = (mountedWeapons[weaponId] || 0) + Number(count) * Number(quantity);
        }
    }
    const weaponSummary = Object.entries(mountedWeapons).filter(([, quantity]) => quantity > 0).map(([weaponId, quantity]) => `${quantity}× ${db.weapons[weaponId]?.name || weaponId}`).join(" | ") || "Unarmed";
    return `<div class="card"><div class="card-title"><b>${esc(u.name)} <span class="pill">${id}</span></b><button class="btn danger" onclick="delete db.units['${id}']; render()">Delete</button></div>
        <div class="grid three">
            ${unitInput(id,"name",u.name,"Name / 名称")}${unitInput(id,"faction",u.faction,"Faction / 阵营")}${unitInput(id,"icon",u.icon || "","Icon text / 图标文字")}
            ${unitInput(id,"personnel",u.personnel,"Personnel / 人数","number","1")}${unitInput(id,"equipment_level",u.equipment_level,"Equipment Level / 装备水平","number","0.1")}${unitInput(id,"morale",u.morale,"Morale / 士气","number","1")}
            ${unitInput(id,"lon",u.lon,"Longitude / 经度","number","0.001")}${unitInput(id,"lat",u.lat,"Latitude / 纬度","number","0.001")}${unitInput(id,"entrenchment",u.entrenchment || 0,"Entrenchment / 工事","number","0.1")}
            <div><label>Unit Type / 单位类型</label><select onchange="db.units['${id}'].unit_type=this.value; if ((db.rules.unit_types[this.value]?.capabilities || []).includes(db.rules.missions?.airstrike?.capability)) db.units['${id}'].aircraft_type = db.units['${id}'].aircraft_type || db.rules.missions.airstrike.default_aircraft_type; render();">${typeOptions}</select></div>
            <div><label>Derived Weapon Loadout / 自动武器编成</label><div class="small">${esc(weaponSummary)}</div></div>
            <div><label>Default Stance / 默认姿态</label><select onchange="db.units['${id}'].stance=this.value">${stanceOptions}</select></div>
            ${aircraftField}

function unitInput(id, key, value, label, type="text", step="") { return `<div><label>${label}</label><input type="${type}" ${step ? `step="${step}"` : ""} value="${esc(value)}" onchange="db.units['${id}'].${key}=this.type==='number'?n(this.value):this.value"></div>`; }
function setComp(id, b, value) { if (!db.units[id].composition) db.units[id].composition = {}; if (value > 0) db.units[id].composition[b] = value; else delete db.units[id].composition[b]; delete db.units[id].primary_weapon; render(); }
function addUnit() {
    const id = "unit_" + Date.now().toString().slice(-8);

function addInstallation() {
    if (!Array.isArray(db.scenario.military_installations)) db.scenario.military_installations = [];
    const [typeId, profile] = Object.entries(db.rules?.military_installations?.types || {})[0] || [];

    db.scenario.military_installations.push({
        id: "inst_" + Date.now().toString().slice(-8),
        type_id: typeId,
        name: `${faction} ${profile.label || typeId}`,
        faction,
        lon: n(center[1]),
        lat: n(center[0]),
        integrity: n(profile.max_integrity),
        construction_progress: 1,
        builder_unit_id: null,
    });
    render();

function changeInstallationType(index, typeId) {
    const site = db.scenario.military_installations[index];
    const previousMaximum = n(db.rules?.military_installations?.types?.[site.type_id]?.max_integrity);
    const nextProfile = db.rules?.military_installations?.types?.[typeId];
    site.type_id = typeId;
    if (nextProfile && (!Number.isFinite(site.integrity) || site.integrity === previousMaximum || site.integrity > n(nextProfile.max_integrity))) {
        site.integrity = n(nextProfile.max_integrity);
    }
    render();
}

function validateDlc(showAlert=true) {
    const checks = [];
    checks.push({ok: !!db.scenario.scenario_name, msg:"Scenario has a name"});
    checks.push({ok: Object.keys(db.units).length > 0, msg:"At least one unit exists"});
    checks.push({ok: Object.keys(db.battalions).length > 0, msg:"At least one battalion type exists"});
    checks.push({ok: Object.keys(db.weapons).length > 0, msg:"At least one weapon exists"});
    checks.push({ok: db.rules?.schema_version === 1, msg:"rules.json uses schema version 1"});
    checks.push({ok: !!db.rules?.unit_types?.[db.rules?.unit_defaults?.unit_type], msg:"Default unit type exists in rules"});
    checks.push({ok: !!db.rules?.missions?.airstrike?.aircraft_types?.[db.rules?.missions?.airstrike?.default_aircraft_type], msg:"Default aircraft type exists in airstrike rules"});
    const installationTypes = db.rules?.military_installations?.types || {};
    checks.push({ok: db.rules?.military_installations && typeof db.rules.military_installations === "object", msg:"Military-installation construction and damage rules exist"});
    checks.push({ok: Object.keys(installationTypes).length > 0, msg:"At least one military-installation type exists"});
    for (const [id, profile] of Object.entries(installationTypes)) {
        checks.push({ok: validId(id), msg:`${id} is a safe installation-type ID`});
        checks.push({ok: !!String(profile.label || "").trim() && !!String(profile.description || "").trim() && !!String(profile.icon || "").trim(), msg:`Installation type ${id} has a label, description, and icon`});
        checks.push({ok: [profile.max_integrity, profile.construction_hours, profile.construction_supply_cost, profile.radius_km, profile.armor, profile.softness, profile.visibility, profile.effect_radius_km, profile.fortification_cover_bonus, profile.radar_range_km, profile.radar_recon_power].every(Number.isFinite), msg:`Installation type ${id} has complete numeric construction, protection, and effect data`});
        checks.push({ok: profile.max_integrity > 0 && profile.construction_hours > 0 && profile.construction_supply_cost >= 0 && profile.softness >= 0 && profile.softness <= 1, msg:`Installation type ${id} has valid durability, build cost, and softness`});
    }
    checks.push({ok: !!db.doctrine?.stances?.[db.rules?.unit_defaults?.stance], msg:"Default stance exists in core doctrine"});
    const aircraftFactorFields = [
        "cruise_speed_multiplier", "sortie_range_multiplier", "blast_radius_multiplier",
        "soft_target_multiplier", "hard_target_multiplier", "accuracy_multiplier", "unobserved_targeting_multiplier", "payload_multiplier",
        "morale_shock_multiplier", "suppression_multiplier", "supply_cost_multiplier",
        "fatigue_cost_multiplier", "aa_vulnerability_multiplier"
    ];
    for (const [id, profile] of Object.entries(db.rules?.missions?.airstrike?.aircraft_types || {})) {
        checks.push({ok: !!String(profile.label || "").trim() && !!String(profile.description || "").trim() && !!String(profile.attack_profile || "").trim(), msg:`Aircraft type ${id} has a label, description, and attack profile`});
        checks.push({ok: aircraftFactorFields.every(field => Number.isFinite(profile[field]) && profile[field] >= 0), msg:`Aircraft type ${id} has every non-negative performance factor`});
        checks.push({ok: profile.cruise_speed_multiplier > 0 && profile.sortie_range_multiplier > 0 && profile.blast_radius_multiplier > 0, msg:`Aircraft type ${id} has positive speed, range, and effect-radius factors`});
    }
    const bounds = db.scenario.map_config?.bounds || {};
    checks.push({ok: [bounds.min_lon,bounds.max_lon,bounds.min_lat,bounds.max_lat].every(Number.isFinite) && bounds.min_lon < bounds.max_lon && bounds.min_lat < bounds.max_lat, msg:"Map bounds are valid"});
    checks.push({ok: Array.isArray(db.scenario.map_center) && db.scenario.map_center.length === 2 && db.scenario.map_center.every(Number.isFinite), msg:"Map center is valid"});
    const cities = Array.isArray(db.scenario.cities) ? db.scenario.cities : [];
    checks.push({ok: Array.isArray(db.scenario.cities), msg:"City influence data is a list"});
    checks.push({ok: new Set(cities.map(city => city.id)).size === cities.length, msg:"City IDs are unique"});
    for (const city of cities) {
        checks.push({ok: validId(city.id), msg:`${city.id || "City"} has a safe city ID`});
        checks.push({ok: !!String(city.name || "").trim(), msg:`${city.id || "City"} has a name`});
        checks.push({ok: Number.isFinite(city.lon) && city.lon >= -180 && city.lon <= 180 && Number.isFinite(city.lat) && city.lat >= -90 && city.lat <= 90, msg:`${city.id || "City"} has valid coordinates`});
        checks.push({ok: Number.isFinite(city.area_km2) && city.area_km2 >= 0, msg:`${city.id || "City"} has a non-negative area`});
        checks.push({ok: Number.isFinite(city.influence_rate) && city.influence_rate >= 0 && city.influence_rate <= 1, msg:`${city.id || "City"} influence is between 0 and 1`});
    }
    const installations = Array.isArray(db.scenario.military_installations) ? db.scenario.military_installations : [];
    checks.push({ok: Array.isArray(db.scenario.military_installations), msg:"Starting military targets are stored as a list"});
    checks.push({ok: new Set(installations.map(site => site.id)).size === installations.length, msg:"Military-target IDs are unique"});
    checks.push({ok: installations.every(site => !Object.hasOwn(db.units, site.id)), msg:"Military-target IDs do not conflict with unit IDs"});
    for (const site of installations) {
        const label = site.id || "Military target";
        const profile = installationTypes[site.type_id];
        checks.push({ok: validId(site.id), msg:`${label} has a safe target ID`});
        checks.push({ok: !!String(site.name || "").trim() && !!String(site.faction || "").trim(), msg:`${label} has a name and owning faction`});
        checks.push({ok: !!profile, msg:`${label} uses an installation type from rules.json`});
        checks.push({ok: Number.isFinite(site.lon) && site.lon >= -180 && site.lon <= 180 && Number.isFinite(site.lat) && site.lat >= -90 && site.lat <= 90, msg:`${label} has valid coordinates`});
        checks.push({ok: Number.isFinite(site.construction_progress) && site.construction_progress >= 0 && site.construction_progress <= 1, msg:`${label} construction progress is between 0 and 1`});
        checks.push({ok: Number.isFinite(site.integrity) && site.integrity >= 0 && (!profile || site.integrity <= profile.max_integrity), msg:`${label} integrity is within its type maximum`});
        checks.push({ok: !site.builder_unit_id || !!db.units[site.builder_unit_id], msg:`${label} builder is empty or references an existing unit`});
    }
    const politics = Array.isArray(db.scenario.province_politics) ? db.scenario.province_politics : [];
    checks.push({ok: Array.isArray(db.scenario.province_politics), msg:"Province politics data is a list"});
    checks.push({ok: new Set(politics.map(entry => `${entry.province}\u0000${entry.faction}`)).size === politics.length, msg:"Province-faction political records are unique"});
    for (const entry of politics) {
        const label = `${entry.province || "Province"} / ${entry.faction || "Faction"}`;
        checks.push({ok: !!String(entry.province || "").trim() && !!String(entry.faction || "").trim(), msg:`${label} names a province and faction`});
        checks.push({ok: Number.isFinite(entry.civilian_sentiment) && entry.civilian_sentiment >= -1 && entry.civilian_sentiment <= 1, msg:`${label} civilian sentiment is between -1 and 1`});
        checks.push({ok: Number.isFinite(entry.occupation) && entry.occupation >= 0 && entry.occupation <= 1, msg:`${label} initial occupation is between 0 and 1`});
    }
    for (const id of [...Object.keys(db.units), ...Object.keys(db.battalions), ...Object.keys(db.weapons), ...installations.map(site => site.id)]) {
        checks.push({ok: validId(id), msg:`${id} is a safe package ID`});
    }
    for (const [id, u] of Object.entries(db.units)) {
        checks.push({ok: Object.keys(u.composition || {}).every(k => !!db.battalions[k]), msg:`${id} composition uses existing battalion IDs`});
        const mountedWeaponIds = new Set(Object.keys(u.composition || {}).flatMap(battalionId => Object.keys(db.battalions[battalionId]?.weapons || {})));
        if (u.primary_weapon) checks.push({ok: mountedWeaponIds.has(u.primary_weapon), msg:`${id} highlighted weapon is mounted by its battalions`});
        checks.push({ok: Number.isFinite(u.lon) && Number.isFinite(u.lat) && Number.isFinite(u.personnel) && u.personnel >= 0, msg:`${id} has valid coordinates and personnel`});
        checks.push({ok: !!db.rules?.unit_types?.[u.unit_type], msg:`${id} uses a unit type from rules.json`});
        checks.push({ok: !!db.doctrine?.stances?.[u.stance], msg:`${id} uses a core combat stance`});
        const hasAirstrike = (db.rules?.unit_types?.[u.unit_type]?.capabilities || []).includes(db.rules?.missions?.airstrike?.capability);
        if (hasAirstrike) checks.push({ok: !!db.rules?.missions?.airstrike?.aircraft_types?.[u.aircraft_type], msg:`${id} uses an aircraft type from rules.json`});
    }
    for (const [id, b] of Object.entries(db.battalions)) {
        checks.push({ok: Number.isInteger(b.armor_generation) && b.armor_generation >= 0, msg:`${id} has a separate non-negative whole-number armor generation`});
        checks.push({ok: Number.isFinite(b.recon_power) && Number.isFinite(b.movement_supply_cost) && b.movement_supply_cost >= 0, msg:`${id} has recon and movement supply data`});
        checks.push({ok: b.weapons && typeof b.weapons === "object" && !Array.isArray(b.weapons), msg:`${id} has a weapon-group object`});
        checks.push({ok: Object.entries(b.weapons || {}).every(([weaponId, quantity]) => !!db.weapons[weaponId] && Number.isFinite(quantity) && quantity > 0), msg:`${id} weapon groups use existing weapons and positive quantities`});
        checks.push({ok: !["soft","hard","ap"].some(field => Object.hasOwn(b, field)), msg:`${id} stores attack and penetration in weapons, not the battalion`});
    }
    const allowedWeaponRoles = new Set(["direct_fire", "bombard", "airstrike"]);
    for (const [id, w] of Object.entries(db.weapons)) {
        checks.push({ok: Number.isInteger(w.generation) && w.generation >= 0, msg:`${id} has a non-negative whole-number weapon generation`});
        checks.push({ok: typeof w.indirect_fire === "boolean", msg:`${id} declares direct or indirect fire`});
        checks.push({ok: Array.isArray(w.roles) && w.roles.length > 0 && w.roles.every(role => allowedWeaponRoles.has(role)), msg:`${id} has valid mission roles`});
        const bands = Array.isArray(w.range_bands) ? w.range_bands : [];
        checks.push({ok: bands.length > 0, msg:`${id} has at least one range band`});
        checks.push({ok: bands.every((band, index) => Number.isFinite(band.max_range_km) && band.max_range_km > (index ? bands[index - 1].max_range_km : 0) && [band.soft_attack, band.hard_attack, band.armor_piercing].every(value => Number.isFinite(value) && value >= 0)), msg:`${id} range bands are ordered and contain non-negative attack data`});
        checks.push({ok: !w.roles?.includes("bombard") || w.indirect_fire === true, msg:`${id} uses indirect fire when assigned the bombard role`});
    }
    if (showAlert) alert(checks.map(c => `${c.ok ? 'OK' : 'FIX'} - ${c.msg}`).join("\n"));
    return checks;
}

async function loadTemplate(confirmReplace=true) {
    if (confirmReplace && !confirm("Replace current editor data with the default crisis template?")) return;
    try {
        const response = await fetch('/api/editor_template');
        const data = await response.json();
        if (!response.ok || data.status !== 'ok') throw new Error(data.msg || `Request failed (${response.status})`);
        db = {scenario:data.scenario, units:data.units, battalions:data.battalions, weapons:data.weapons, rules:data.rules, doctrine:data.doctrine};
        mapFiles = { dem: [], roads: null, rivers: null, provinces: null };
        render();
    } catch (error) {
        byId("content").innerHTML = `<div class="section"><h2 style="color:#ff7b72;">Starter package failed to load</h2><p>${esc(error.message)}</p></div>`;
    }
}

async function exportAll() {
    const failed = validateDlc(false).filter(c => !c.ok);
    if (failed.length && !confirm("Some checks failed. Export anyway?")) return;
    if (typeof JSZip === 'undefined') { alert("ZIP library unavailable. Connect to the internet and reload the editor."); return; }
    const zip = new JSZip();
    const scenario = JSON.parse(JSON.stringify(db.scenario));
    if (mapFiles.roads) scenario.map_config.roads_file = "maps/" + mapFiles.roads.name;
    if (mapFiles.rivers) scenario.map_config.rivers_file = "maps/" + mapFiles.rivers.name;
    if (mapFiles.provinces) scenario.map_config.provinces_file = "maps/" + mapFiles.provinces.name;
    if (mapFiles.dem.length) scenario.map_config.dem_dir = "maps/dem_tiles";
    zip.file("scenario.json", JSON.stringify(scenario, null, 2));
    zip.file("units.json", JSON.stringify(db.units, null, 2));
    zip.file("battalions.json", JSON.stringify(db.battalions, null, 2));
    zip.file("weapons.json", JSON.stringify(db.weapons, null, 2));
    zip.file("rules.json", JSON.stringify(db.rules, null, 2));
    for (const f of mapFiles.dem) zip.file("maps/dem_tiles/" + f.name, f);
    if (mapFiles.roads) zip.file("maps/" + mapFiles.roads.name, mapFiles.roads);
    if (mapFiles.rivers) zip.file("maps/" + mapFiles.rivers.name, mapFiles.rivers);
    if (mapFiles.provinces) zip.file("maps/" + mapFiles.provinces.name, mapFiles.provinces);
    const blob = await zip.generateAsync({type:"blob"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${scenario.scenario_name.replace(/[^a-z0-9]+/gi, "_").toLowerCase()}_dlc.zip`;
    a.click();
    URL.revokeObjectURL(a.href);
}

render();
loadTemplate(false);
</script>
