<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CDC Scenario Pack Builder</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <style>
        body { margin:0; background:#050a0f; color:#c9d1d9; font-family:"Segoe UI", Arial, sans-serif; overflow:hidden; user-select:text; }
        #header { height:58px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; background:#0d1117; border-bottom:1px solid #30363d; }
        #workspace { display:grid; grid-template-columns:260px 1fr; height:calc(100vh - 59px); }
        #sidebar { background:#0d1117; border-right:1px solid #30363d; padding:12px; overflow-y:auto; }
        #content { overflow-y:auto; padding:22px; }
        .nav-btn { width:100%; text-align:left; margin-bottom:7px; padding:10px; border:1px solid #30363d; background:#010409; color:#c9d1d9; border-radius:4px; cursor:pointer; }
        .nav-btn.active { border-color:#58a6ff; color:#58a6ff; background:#1f6feb20; }
        .section { border:1px solid #30363d; background:#0d1117; border-radius:6px; padding:16px; margin-bottom:16px; }
        .section h2 { margin:0 0 10px; color:#58a6ff; font-size:18px; }
        .hint { color:#8b949e; font-size:12px; line-height:1.45; margin-bottom:12px; }
        .grid { display:grid; grid-template-columns:repeat(2, minmax(220px, 1fr)); gap:12px; }
        .grid.three { grid-template-columns:repeat(3, minmax(180px, 1fr)); }
        label { color:#8b949e; font-size:12px; font-weight:600; display:block; margin-bottom:4px; }
        input, select, textarea { width:100%; box-sizing:border-box; background:#010409; color:#c9d1d9; border:1px solid #30363d; border-radius:4px; padding:8px; font-family:inherit; }
        textarea { min-height:76px; resize:vertical; }
        .btn { border:1px solid #2ea043; background:#238636; color:#fff; border-radius:4px; padding:8px 12px; cursor:pointer; font-weight:600; }
        .btn.secondary { background:#1f6feb; border-color:#58a6ff; }
        .btn.warn { background:#9a6700; border-color:#e3b341; }
        .btn.danger { background:#da3633; border-color:#f85149; }
        .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
        .card { border:1px solid #30363d; background:#010409; padding:12px; border-radius:5px; margin-bottom:10px; }
        .card-title { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
        .small { font-size:12px; color:#8b949e; }
        .pill { display:inline-block; border:1px solid #30363d; border-radius:999px; padding:2px 8px; margin:2px; color:#8b949e; font-size:11px; }
        .zh-only { display:none; }
        body.zh .en-only { display:none; }
        body.zh .zh-only { display:inline; }
    </style>
</head>
<body>
<div id="header">
    <div>
        <div style="font-size:20px; font-weight:700; color:#fff;"><span data-en="CDC Scenario Pack Builder" data-zh="CDC 剧本包生成器">CDC Scenario Pack Builder</span></div>
        <div class="small"><span data-en="No-code scenario package creator for MUN chairs" data-zh="面向模联危机委员会主席团的无代码剧本包工具">No-code scenario package creator for MUN chairs</span></div>
    </div>
    <div class="toolbar" style="margin:0;">
        <button class="btn secondary" onclick="toggleLanguage()">EN / 中文</button>
        <button class="btn warn" onclick="loadTemplate('crisis')"><span data-en="Load Crisis Template" data-zh="载入危机剧本模板">Load Crisis Template</span></button>
        <button class="btn secondary" onclick="checkScenarioPackage()"><span data-en="Check Package" data-zh="检查剧本包">Check Package</span></button>
        <button class="btn" onclick="exportAll()"><span data-en="Export Scenario ZIP" data-zh="导出剧本 ZIP">Export Scenario ZIP</span></button>
    </div>
</div>

<div id="workspace">
    <div id="sidebar">
        <button class="nav-btn active" onclick="switchTab('start', this)"><span data-en="1. Start" data-zh="1. 开始">1. Start</span></button>
        <button class="nav-btn" onclick="switchTab('scenario', this)"><span data-en="2. Scenario & Map" data-zh="2. 剧本与地图">2. Scenario & Map</span></button>
        <button class="nav-btn" onclick="switchTab('rules', this)"><span data-en="3. Simulation Rules" data-zh="3. 推演规则">3. Simulation Rules</span></button>
        <button class="nav-btn" onclick="switchTab('committee', this)"><span data-en="4. Committee" data-zh="4. 委员会">4. Committee</span></button>
        <button class="nav-btn" onclick="switchTab('diplomacy', this)"><span data-en="5. Diplomacy" data-zh="5. 外交阵营">5. Diplomacy</span></button>
        <button class="nav-btn" onclick="switchTab('units', this)"><span data-en="6. Units" data-zh="6. 部队">6. Units</span></button>
        <button class="nav-btn" onclick="switchTab('battalions', this)"><span data-en="7. Battalion Types" data-zh="7. 营种">7. Battalion Types</span></button>
        <button class="nav-btn" onclick="switchTab('weapons', this)"><span data-en="8. Weapons" data-zh="8. 武器">8. Weapons</span></button>
        <button class="nav-btn" onclick="switchTab('installations', this)"><span data-en="9. Military Targets" data-zh="9. 军事目标">9. Military Targets</span></button>
        <button class="nav-btn" onclick="switchTab('metadata', this)"><span data-en="10. Metadata" data-zh="10. 剧本包信息">10. Metadata</span></button>
        <button class="nav-btn" onclick="switchTab('objectives', this)"><span data-en="11. Objectives" data-zh="11. 目标">11. Objectives</span></button>
        <button class="nav-btn" onclick="switchTab('events', this)"><span data-en="12. Events" data-zh="12. 事件">12. Events</span></button>
        <button class="nav-btn" onclick="switchTab('export', this)"><span data-en="13. Export" data-zh="13. 导出">13. Export</span></button>
    </div>
    <div id="content"></div>
</div>

<script src="/static/vendor/jszip/jszip.min.js"></script>
<script src="/static/js/scenario_authoring.js"></script>
<script>
let db = null;

let currentTab = "start";
let mapFiles = { dem: [], roads: null, rivers: null, provinces: null };

function byId(id) { return document.getElementById(id); }
function esc(value) { return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;"); }
function n(value, fallback=0) { const parsed = parseFloat(value); return Number.isFinite(parsed) ? parsed : fallback; }
function validId(value) { return /^[A-Za-z0-9_][A-Za-z0-9_.-]{0,63}$/.test(value || ""); }
function switchTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
    if (btn) btn.classList.add("active");
    render();
}
function editorIsChinese() { return typeof localStorage !== "undefined" && (localStorage.getItem("cdc_lang") || "en") === "zh"; }
function tr(en, zh) { return editorIsChinese() ? zh : en; }
const editorCoreOrderLabelsZh = {
    hold: "原地待命", relocate: "安全转移", route: "按路线移动",
    assault: "进攻", defend: "原地防守", fortify: "加固阵地"
};
const editorCoreStanceLabelsZh = {
    AGGRESSIVE: "进攻优先", DEFENSIVE: "防守优先", STEALTH: "隐蔽行动",
    RECON: "侦察优先", RESERVE: "休整待命", HOLD_FIRE: "禁止远程开火"
};
function localizedDoctrineLabel(kind, id, profile) {
    const fallback = profile?.label || id;
    if (!editorIsChinese()) return fallback;
    const labels = kind === "order" ? editorCoreOrderLabelsZh : editorCoreStanceLabelsZh;
    return labels[id] || fallback;
}
function applyEditorLanguage() {
    const zh = editorIsChinese();
    if (document.documentElement) document.documentElement.lang = zh ? "zh-CN" : "en";
    if (document.body?.classList) document.body.classList.toggle("zh", zh);
    document.querySelectorAll("[data-en][data-zh]").forEach(element => {
        element.textContent = zh ? element.dataset.zh : element.dataset.en;
    });
    document.title = tr("CDC Scenario Pack Builder", "CDC 剧本包生成器");
}
function toggleLanguage() {
    localStorage.setItem("cdc_lang", editorIsChinese() ? "en" : "zh");
    applyEditorLanguage();
    render();
}
function setPath(obj, path, value) {
    const parts = path.split(".");
    let target = obj;
    while (parts.length > 1) target = target[parts.shift()];
    target[parts[0]] = value;
}
function input(label, path, value, type="text", step="") {
    const sync = path.startsWith("rules.") ? "; syncRulesJson()" : "";
    return `<div><label>${label}</label><input type="${type}" ${step ? `step="${step}"` : ""} value="${esc(value)}" onchange="setPath(db, '${path}', this.type==='number' ? n(this.value) : this.value)${sync}"></div>`;
}
function textarea(label, path, value) {
    return `<div style="grid-column:1/-1;"><label>${label}</label><textarea onchange="setPath(db, '${path}', this.value)">${esc(value)}</textarea></div>`;
}
function render() {
    if (!db) {
        byId("content").innerHTML = `<div class="section"><h2>${tr("Loading scenario pack starter…", "正在载入剧本包模板……")}</h2></div>`;
        return;
    }
    const renders = { start: renderStart, scenario: renderScenario, rules: renderRules, committee: renderCommittee, diplomacy: renderDiplomacy, units: renderUnits, battalions: renderBattalions, weapons: renderWeapons, installations: renderInstallations, metadata: renderMetadata, objectives: renderObjectives, events: renderEvents, export: renderExport };
    byId("content").innerHTML = renders[currentTab]();
    applyEditorLanguage();
}

function renderStart() {
    return `<div class="section">
        <h2>${tr("Chair-Friendly Scenario Pack Builder", "主席团无代码剧本包生成器")}</h2>
        <p class="hint">${tr("Create a scenario through the tabs. Add pack metadata, chair-reviewed objectives and event cards, then export a versioned package. Maps, forces, politics and simulation rules are content; creating a pack does not require engine code changes.", "通过各标签页创建剧本，填写剧本包信息、由主席团审核的目标与事件卡，然后导出带版本号的剧本包。地图、部队、政治设定和推演规则都属于内容，创建剧本包无需修改引擎代码。")}</p>
        <div class="grid">
            <div class="card"><b>${tr("1. Scenario & Map", "1. 剧本与地图")}</b><p class="small">${tr("Name the committee and define map bounds.", "命名委员会并设置地图边界。")}</p></div>
            <div class="card"><b>${tr("2. Simulation Rules", "2. 推演规则")}</b><p class="small">${tr("Tune clock, readiness, detection, aircraft types, combat missions, and political influence.", "调整时间、战备、侦察、飞机类型、战斗任务和政治影响。")}</p></div>
            <div class="card"><b>${tr("3. Committee", "3. 委员会")}</b><p class="small">${tr("Add delegate roles, procedure, victory conditions, and staff notes.", "添加代表角色、议事程序、胜利条件和主席团备注。")}</p></div>
            <div class="card"><b>${tr("4. Diplomacy", "4. 外交关系")}</b><p class="small">${tr("Group factions that start as allies.", "将开局即结盟的阵营编入同一集团。")}</p></div>
            <div class="card"><b>${tr("5. Units", "5. 部队")}</b><p class="small">${tr("Place battle units using scenario-defined types and core combat stances.", "使用剧本中的部队类型和程序内置战斗方式来部署部队。")}</p></div>
            <div class="card"><b>${tr("6. Battalion Types", "6. 营种")}</b><p class="small">${tr("Define defense, armor generation, logistics, capabilities, and mounted weapon groups.", "定义防御、装甲代数、后勤、能力和配属武器组。")}</p></div>
            <div class="card"><b>${tr("7. Weapons", "7. 武器")}</b><p class="small">${tr("Define weapon generation, mission roles, and attack/penetration values for every range band.", "定义武器代数、任务角色，以及每个射程区间的攻击和穿甲数值。")}</p></div>
            <div class="card"><b>${tr("8. Military Targets", "8. 军事目标")}</b><p class="small">${tr("Place forts, radar sites, and construction projects. Type effects remain scenario rules.", "布置要塞、雷达站和建设项目；其类型效果由剧本规则定义。")}</p></div>
        </div>
        <div class="grid">
            <div class="card"><b>${tr("9. Metadata", "9. 剧本包信息")}</b><p class="small">${tr("Set the stable pack ID, version, publisher and content terms.", "设置稳定的剧本包 ID、版本、发布者和内容条款。")}</p></div>
            <div class="card"><b>${tr("10. Objectives & Events", "10. 目标与事件")}</b><p class="small">${tr("Write objective criteria and crisis cards for chairs to review and issue during play.", "编写目标判定标准与危机事件卡，供主席团在推演中审核并发布。")}</p></div>
        </div>
        <div class="section"><h2>${tr("Map File Rules", "地图文件规则")}</h2>
        <p class="hint">${tr("Optional map files can be attached in Scenario & Map. DEM files are placed in <code>maps/dem_tiles</code>. Roads, rivers, and province files are placed in <code>maps</code>.", "可在“剧本与地图”中附加地图文件。DEM 文件会放入 <code>maps/dem_tiles</code>；道路、河流和省界文件会放入 <code>maps</code>。")}</p></div>
    </div>`;
}

function renderScenario() {
    const s = db.scenario, b = s.map_config.bounds;
    if (!Array.isArray(s.cities)) s.cities = [];
    if (!Array.isArray(s.province_politics)) s.province_politics = [];
    return `<div class="section"><h2>${tr("Scenario & Map", "剧本与地图")}</h2>
        <div class="grid">
            ${input(tr("Scenario Name", "剧本名称"), "scenario.scenario_name", s.scenario_name)}
            ${input(tr("Description", "简介"), "scenario.description", s.description)}
            ${input(tr("Map Center Latitude", "地图中心纬度"), "scenario.map_center.0", s.map_center[0], "number", "0.001")}
            ${input(tr("Map Center Longitude", "地图中心经度"), "scenario.map_center.1", s.map_center[1], "number", "0.001")}
            ${input(tr("Map Zoom", "地图缩放"), "scenario.map_zoom", s.map_zoom, "number", "1")}
            ${input(tr("Grid Width", "网格宽度"), "scenario.map_config.grid_resolution.0", s.map_config.grid_resolution[0], "number", "1")}
            ${input(tr("Grid Height", "网格高度"), "scenario.map_config.grid_resolution.1", s.map_config.grid_resolution[1], "number", "1")}
            ${input(tr("DEM Analysis Width", "高程分析宽度"), "scenario.map_config.dem_analysis_resolution.0", s.map_config.dem_analysis_resolution?.[0] || 1200, "number", "1")}
            ${input(tr("DEM Analysis Height", "高程分析高度"), "scenario.map_config.dem_analysis_resolution.1", s.map_config.dem_analysis_resolution?.[1] || 1200, "number", "1")}
            ${input(tr("Minimum Longitude", "最小经度"), "scenario.map_config.bounds.min_lon", b.min_lon, "number", "0.001")}
            ${input(tr("Maximum Longitude", "最大经度"), "scenario.map_config.bounds.max_lon", b.max_lon, "number", "0.001")}
            ${input(tr("Minimum Latitude", "最小纬度"), "scenario.map_config.bounds.min_lat", b.min_lat, "number", "0.001")}
            ${input(tr("Maximum Latitude", "最大纬度"), "scenario.map_config.bounds.max_lat", b.max_lat, "number", "0.001")}
            ${input(tr("Province Name Property", "省名字段"), "scenario.map_config.province_name_property", s.map_config.province_name_property || "")}
            ${input(tr("Fallback Elevation (m)", "默认海拔（米）"), "scenario.map_config.fallback_elevation_m", s.map_config.fallback_elevation_m ?? 0, "number", "1")}
        </div>
    </div>
    <div class="section"><h2>${tr("Optional Map Files", "可选地图文件")}</h2>
        <p class="hint">${tr("You may export a playable scenario pack without map files. The simulator will use fallback terrain. For serious committees, add DEM/province/road files.", "即使不附加地图文件，也可导出可运行的剧本包；模拟器将使用备用地形。正式委员会建议加入 DEM、省界和道路文件。")}</p>
        <div class="grid">
            <div><label>${tr("DEM tiles (.tif, multiple)", "高程瓦片（.tif，可多选）")}</label><input type="file" multiple accept=".tif,.tiff" onchange="mapFiles.dem = Array.from(this.files)"></div>
            <div><label>${tr("Road raster/vector", "道路栅格或矢量文件")}</label><input type="file" accept=".tif,.tiff,.geojson,.json" onchange="mapFiles.roads = this.files[0] || null"></div>
            <div><label>${tr("River GeoJSON", "河流 GeoJSON 文件")}</label><input type="file" accept=".geojson,.json" onchange="mapFiles.rivers = this.files[0] || null"></div>
            <div><label>${tr("Province GeoJSON", "省界 GeoJSON 文件")}</label><input type="file" accept=".geojson,.json" onchange="mapFiles.provinces = this.files[0] || null"></div>
        </div>
    </div>
    ${renderCities()}
    ${renderProvincePolitics()}`;
}

function renderCities() {
    const cities = db.scenario.cities;
    return `<div class="section"><h2>${tr("City Influence Areas", "城市影响区")}</h2>
        <p class="hint">${tr("Cities affect every army inside their circular area through the existing terrain, cover, frontage, concealment, movement, and fatigue systems. Influence 0 has no effect; 1 represents maximum major-city complexity (for example, New York). Overlapping areas use the strongest influence.", "城市通过现有的地形、掩体、战斗正面、隐蔽、移动和疲劳系统影响圆形范围内的所有部队。影响率 0 表示无影响，1 表示特大城市的最高复杂度（例如纽约）。重叠区域取最高影响率。")}</p>
        <div class="toolbar"><button class="btn secondary" onclick="addCity()">${tr("Add City", "添加城市")}</button></div>
        ${cities.length ? cities.map((city, i) => `<div class="card">
            <div class="card-title"><b>${esc(city.name || tr("New City", "新城市"))} <span class="pill">${esc(city.id)}</span></b><button class="btn danger" onclick="db.scenario.cities.splice(${i},1); render()">${tr("Delete", "删除")}</button></div>
            <div class="grid three">
                ${cityInput(i, "id", city.id, tr("City ID", "城市 ID"))}
                ${cityInput(i, "name", city.name, tr("Name", "名称"))}
                ${cityInput(i, "description", city.description || "", tr("City Information", "城市信息"))}
                ${cityInput(i, "lon", city.lon, tr("Longitude", "经度"), "number", "0.001", "-180", "180")}
                ${cityInput(i, "lat", city.lat, tr("Latitude", "纬度"), "number", "0.001", "-90", "90")}
                ${cityInput(i, "area_km2", city.area_km2 ?? 0, tr("Area (km²)", "面积（平方公里）"), "number", "0.1", "0")}
                ${cityInput(i, "influence_rate", city.influence_rate ?? 0, tr("Influence Rate (0–1)", "影响率（0–1）"), "number", "0.01", "0", "1")}
            </div>
        </div>`).join("") : `<div class="card small">${tr("No cities configured. The default city influence is 0.", "尚未配置城市，默认城市影响率为 0。")}</div>`}
    </div>`;
}

function cityInput(index, key, value, label, type="text", step="", min="", max="") {
    return `<div><label>${label}</label><input type="${type}" ${step ? `step="${step}"` : ""} ${min !== "" ? `min="${min}"` : ""} ${max !== "" ? `max="${max}"` : ""} value="${esc(value)}" onchange="db.scenario.cities[${index}].${key}=this.type==='number'?n(this.value):this.value"></div>`;
}

function addCity() {
    const center = db.scenario.map_center || [0, 0];
    const used = new Set(db.scenario.cities.map(city => city.id));
    let suffix = db.scenario.cities.length + 1;
    while (used.has(`city_${suffix}`)) suffix++;
    db.scenario.cities.push({
        id: `city_${suffix}`,
        name: tr("New City", "新城市"),
        description: "",
        lon: n(center[1], 0),
        lat: n(center[0], 0),
        area_km2: 0,
        influence_rate: 0
    });
    render();
}

function renderProvincePolitics() {
    const entries = db.scenario.province_politics;
    return `<div class="section"><h2>${tr("Province Politics", "省份政治")}</h2>
        <p class="hint">${tr("Create one record per province and faction. Civilian sentiment ranges from −1 (maximum opposition), through 0 (indifferent/neutral, the default), to +1 (maximum support). Initial occupation ranges from 0 to 1; military presence changes occupation during play.", "为每个省份与阵营组合创建一条记录。民意范围为 −1（最强反对）、0（默认的中立）到 +1（最强支持）。初始占领度范围为 0 到 1；推演中的军事存在会改变占领度。")}</p>
        <div class="toolbar"><button class="btn secondary" onclick="addProvincePolitics()">${tr("Add Province-Faction Record", "添加省份与阵营记录")}</button></div>
        ${entries.length ? entries.map((entry, i) => `<div class="card">
            <div class="card-title"><b>${esc(entry.province || tr("Province", "省份"))} · ${esc(entry.faction || tr("Faction", "阵营"))}</b><button class="btn danger" onclick="db.scenario.province_politics.splice(${i},1); render()">${tr("Delete", "删除")}</button></div>
            <div class="grid">
                ${politicsInput(i, "province", entry.province, tr("Province Name", "省份名称"))}
                ${politicsInput(i, "faction", entry.faction, tr("Faction", "阵营"))}
                ${politicsInput(i, "civilian_sentiment", entry.civilian_sentiment ?? 0, tr("Civilian Sentiment (−1 to +1)", "民意（−1 至 +1）"), "number", "0.01", "-1", "1")}
                ${politicsInput(i, "occupation", entry.occupation ?? 0, tr("Initial Occupation (0–1)", "初始占领度（0–1）"), "number", "0.01", "0", "1")}
            </div>
        </div>`).join("") : `<div class="card small">${tr("No authored tendencies. Every province-faction relationship defaults to neutral sentiment (0) and no occupation (0).", "尚未设置政治倾向；所有省份与阵营关系默认为中立民意（0）且未被占领（0）。")}</div>`}
    </div>`;
}

function politicsInput(index, key, value, label, type="text", step="", min="", max="") {
    return `<div><label>${label}</label><input type="${type}" ${step ? `step="${step}"` : ""} ${min !== "" ? `min="${min}"` : ""} ${max !== "" ? `max="${max}"` : ""} value="${esc(value)}" onchange="db.scenario.province_politics[${index}].${key}=this.type==='number'?n(this.value):this.value"></div>`;
}

function addProvincePolitics() {
    const faction = db.scenario.committee?.delegate_roles?.[0]?.faction || "FACTION";
    db.scenario.province_politics.push({
        province: tr("Province Name", "省份名称"),
        faction,
        civilian_sentiment: 0,
        occupation: 0
    });
    render();

function syncRulesJson() {
    const editor = byId("rules-json");
    if (editor) editor.value = JSON.stringify(db.rules, null, 2);
}

function applyRulesJson() {
    try {
        const parsed = JSON.parse(byId("rules-json").value);
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) throw new Error(tr("Rules root must be an object.", "规则根节点必须是对象。"));
        if (parsed.schema_version !== 1) throw new Error(tr("schema_version must be 1.", "schema_version 必须为 1。"));
        const requiredObjects = ["clock", "unit_defaults", "unit_types", "detection", "combat", "missions", "political_influence"];
        for (const key of requiredObjects) {
            if (!parsed[key] || typeof parsed[key] !== "object" || Array.isArray(parsed[key])) throw new Error(tr(`Missing required object: ${key}`, `缺少必需对象：${key}`));
        }
        if (parsed.orders || parsed.stances) throw new Error(tr("orders and stances belong to core doctrine and must not be stored in rules.json.", "orders 和 stances 属于核心条令，不得存储在 rules.json 中。"));
        if (!parsed.combat.direct || !parsed.missions.bombard || !parsed.missions.airstrike) throw new Error(tr("Combat and mission rule sections are incomplete.", "战斗与任务规则部分不完整。"));
        if (!parsed.missions.airstrike.aircraft_types?.[parsed.missions.airstrike.default_aircraft_type]) throw new Error(tr("Airstrike rules require aircraft_types and a valid default_aircraft_type.", "空袭规则必须包含 aircraft_types 和有效的 default_aircraft_type。"));
        db.rules = parsed;
        alert(tr("Rules JSON applied. Run Check Package before export.", "规则 JSON 已应用。导出前请运行“检查剧本包”。"));
        render();
    } catch (error) {
        alert(tr("Rules JSON rejected: ", "规则 JSON 被拒绝：") + error.message);
    }
}

function addUnit() {
    const id = "unit_" + Date.now().toString().slice(-8);

    db.units[id] = {name:tr("New Unit", "新部队"), faction, icon:"", personnel:size, lon:center[1], lat:center[0], equipment_level:defaults.equipment_level, unit_type:defaults.unit_type, composition:{[battalionId]:1}, morale:defaults.morale, stance:defaults.stance, entrenchment:defaults.entrenchment};

function changeInstallationType(index, typeId) {
    const site = db.scenario.military_installations[index];

    const nextProfile = db.rules?.military_installations?.types?.[typeId];
    site.type_id = typeId;
    if (nextProfile && (!Number.isFinite(site.integrity) || site.integrity === previousMaximum || site.integrity > n(nextProfile.max_integrity))) {
        site.integrity = n(nextProfile.max_integrity);
    }
    render();
}

function editorCheckMessage(check) {

function validateDlc(showAlert=true) {
    const checks = [];
    checks.push({ok: !!db.scenario.scenario_name, msg:"Scenario has a name"});
    checks.push({ok: Object.keys(db.units).length > 0, msg:"At least one unit exists"});
    checks.push({ok: Object.keys(db.battalions).length > 0, msg:"At least one battalion type exists"});
    checks.push({ok: Object.keys(db.weapons).length > 0, msg:"At least one weapon exists"});
    checks.push({ok: db.rules?.schema_version === 1, msg:"rules.json uses schema version 1"});
    checks.push({ok: !!db.rules?.unit_types?.[db.rules?.unit_defaults?.unit_type], msg:"Default unit type exists in rules"});
    checks.push({ok: !!db.rules?.missions?.airstrike?.aircraft_types?.[db.rules?.missions?.airstrike?.default_aircraft_type], msg:"Default aircraft type exists in airstrike rules"});
    const installationTypes = db.rules?.military_installations?.types || {};
    checks.push({ok: db.rules?.military_installations && typeof db.rules.military_installations === "object", msg:"Military-installation construction and damage rules exist"});
    checks.push({ok: Object.keys(installationTypes).length > 0, msg:"At least one military-installation type exists"});
    for (const [id, profile] of Object.entries(installationTypes)) {
        checks.push({ok: validId(id), msg:`${id} is a safe installation-type ID`});
        checks.push({ok: !!String(profile.label || "").trim() && !!String(profile.description || "").trim() && !!String(profile.icon || "").trim(), msg:`Installation type ${id} has a label, description, and icon`});
        checks.push({ok: [profile.max_integrity, profile.construction_hours, profile.construction_supply_cost, profile.radius_km, profile.armor, profile.softness, profile.visibility, profile.effect_radius_km, profile.fortification_cover_bonus, profile.radar_range_km, profile.radar_recon_power].every(Number.isFinite), msg:`Installation type ${id} has complete numeric construction, protection, and effect data`});
        checks.push({ok: profile.max_integrity > 0 && profile.construction_hours > 0 && profile.construction_supply_cost >= 0 && profile.softness >= 0 && profile.softness <= 1, msg:`Installation type ${id} has valid durability, build cost, and softness`});
    }
    checks.push({ok: !!db.doctrine?.stances?.[db.rules?.unit_defaults?.stance], msg:"Default stance exists in core doctrine"});
    const aircraftFactorFields = [
        "cruise_speed_multiplier", "sortie_range_multiplier", "blast_radius_multiplier",
        "soft_target_multiplier", "hard_target_multiplier", "accuracy_multiplier", "unobserved_targeting_multiplier", "payload_multiplier",
        "morale_shock_multiplier", "suppression_multiplier", "supply_cost_multiplier",
        "fatigue_cost_multiplier", "aa_vulnerability_multiplier"
    ];
    for (const [id, profile] of Object.entries(db.rules?.missions?.airstrike?.aircraft_types || {})) {
        checks.push({ok: !!String(profile.label || "").trim() && !!String(profile.description || "").trim() && !!String(profile.attack_profile || "").trim(), msg:`Aircraft type ${id} has a label, description, and attack profile`});
        checks.push({ok: aircraftFactorFields.every(field => Number.isFinite(profile[field]) && profile[field] >= 0), msg:`Aircraft type ${id} has every non-negative performance factor`});
        checks.push({ok: profile.cruise_speed_multiplier > 0 && profile.sortie_range_multiplier > 0 && profile.blast_radius_multiplier > 0, msg:`Aircraft type ${id} has positive speed, range, and effect-radius factors`});
    }
    const bounds = db.scenario.map_config?.bounds || {};
    checks.push({ok: [bounds.min_lon,bounds.max_lon,bounds.min_lat,bounds.max_lat].every(Number.isFinite) && bounds.min_lon < bounds.max_lon && bounds.min_lat < bounds.max_lat, msg:"Map bounds are valid"});
    checks.push({ok: Array.isArray(db.scenario.map_center) && db.scenario.map_center.length === 2 && db.scenario.map_center.every(Number.isFinite), msg:"Map center is valid"});
    const cities = Array.isArray(db.scenario.cities) ? db.scenario.cities : [];
    checks.push({ok: Array.isArray(db.scenario.cities), msg:"City influence data is a list"});
    checks.push({ok: new Set(cities.map(city => city.id)).size === cities.length, msg:"City IDs are unique"});
    for (const city of cities) {
        checks.push({ok: validId(city.id), msg:`${city.id || "City"} has a safe city ID`});
        checks.push({ok: !!String(city.name || "").trim(), msg:`${city.id || "City"} has a name`});
        checks.push({ok: Number.isFinite(city.lon) && city.lon >= -180 && city.lon <= 180 && Number.isFinite(city.lat) && city.lat >= -90 && city.lat <= 90, msg:`${city.id || "City"} has valid coordinates`});
        checks.push({ok: Number.isFinite(city.area_km2) && city.area_km2 >= 0, msg:`${city.id || "City"} has a non-negative area`});
        checks.push({ok: Number.isFinite(city.influence_rate) && city.influence_rate >= 0 && city.influence_rate <= 1, msg:`${city.id || "City"} influence is between 0 and 1`});
    }
    const installations = Array.isArray(db.scenario.military_installations) ? db.scenario.military_installations : [];
    checks.push({ok: Array.isArray(db.scenario.military_installations), msg:"Starting military targets are stored as a list"});
    checks.push({ok: new Set(installations.map(site => site.id)).size === installations.length, msg:"Military-target IDs are unique"});
    checks.push({ok: installations.every(site => !Object.hasOwn(db.units, site.id)), msg:"Military-target IDs do not conflict with unit IDs"});
    for (const site of installations) {
        const label = site.id || "Military target";
        const profile = installationTypes[site.type_id];
        checks.push({ok: validId(site.id), msg:`${label} has a safe target ID`});
        checks.push({ok: !!String(site.name || "").trim() && !!String(site.faction || "").trim(), msg:`${label} has a name and owning faction`});
        checks.push({ok: !!profile, msg:`${label} uses an installation type from rules.json`});
        checks.push({ok: Number.isFinite(site.lon) && site.lon >= -180 && site.lon <= 180 && Number.isFinite(site.lat) && site.lat >= -90 && site.lat <= 90, msg:`${label} has valid coordinates`});
        checks.push({ok: Number.isFinite(site.construction_progress) && site.construction_progress >= 0 && site.construction_progress <= 1, msg:`${label} construction progress is between 0 and 1`});
        checks.push({ok: Number.isFinite(site.integrity) && site.integrity >= 0 && (!profile || site.integrity <= profile.max_integrity), msg:`${label} integrity is within its type maximum`});
        checks.push({ok: !site.builder_unit_id || !!db.units[site.builder_unit_id], msg:`${label} builder is empty or references an existing unit`});
    }
    const politics = Array.isArray(db.scenario.province_politics) ? db.scenario.province_politics : [];
    checks.push({ok: Array.isArray(db.scenario.province_politics), msg:"Province politics data is a list"});
    checks.push({ok: new Set(politics.map(entry => `${entry.province}\u0000${entry.faction}`)).size === politics.length, msg:"Province-faction political records are unique"});
    for (const entry of politics) {
        const label = `${entry.province || "Province"} / ${entry.faction || "Faction"}`;
        checks.push({ok: !!String(entry.province || "").trim() && !!String(entry.faction || "").trim(), msg:`${label} names a province and faction`});
        checks.push({ok: Number.isFinite(entry.civilian_sentiment) && entry.civilian_sentiment >= -1 && entry.civilian_sentiment <= 1, msg:`${label} civilian sentiment is between -1 and 1`});
        checks.push({ok: Number.isFinite(entry.occupation) && entry.occupation >= 0 && entry.occupation <= 1, msg:`${label} initial occupation is between 0 and 1`});
    }
    for (const id of [...Object.keys(db.units), ...Object.keys(db.battalions), ...Object.keys(db.weapons), ...installations.map(site => site.id)]) {
        checks.push({ok: validId(id), msg:`${id} is a safe package ID`});
    }
    for (const [id, u] of Object.entries(db.units)) {
        checks.push({ok: Object.keys(u.composition || {}).every(k => !!db.battalions[k]), msg:`${id} composition uses existing battalion IDs`});
        const mountedWeaponIds = new Set(Object.keys(u.composition || {}).flatMap(battalionId => Object.keys(db.battalions[battalionId]?.weapons || {})));
        if (u.primary_weapon) checks.push({ok: mountedWeaponIds.has(u.primary_weapon), msg:`${id} highlighted weapon is mounted by its battalions`});
        checks.push({ok: Number.isFinite(u.lon) && Number.isFinite(u.lat) && Number.isFinite(u.personnel) && u.personnel >= 0, msg:`${id} has valid coordinates and personnel`});
        checks.push({ok: !!db.rules?.unit_types?.[u.unit_type], msg:`${id} uses a unit type from rules.json`});
        checks.push({ok: !!db.doctrine?.stances?.[u.stance], msg:`${id} uses a core combat stance`});
        const hasAirstrike = (db.rules?.unit_types?.[u.unit_type]?.capabilities || []).includes(db.rules?.missions?.airstrike?.capability);
        if (hasAirstrike) checks.push({ok: !!db.rules?.missions?.airstrike?.aircraft_types?.[u.aircraft_type], msg:`${id} uses an aircraft type from rules.json`});
    }
    for (const [id, b] of Object.entries(db.battalions)) {
        checks.push({ok: Number.isInteger(b.armor_generation) && b.armor_generation >= 0, msg:`${id} has a separate non-negative whole-number armor generation`});
        checks.push({ok: Number.isFinite(b.recon_power) && Number.isFinite(b.movement_supply_cost) && b.movement_supply_cost >= 0, msg:`${id} has recon and movement supply data`});
        checks.push({ok: b.weapons && typeof b.weapons === "object" && !Array.isArray(b.weapons), msg:`${id} has a weapon-group object`});
        checks.push({ok: Object.entries(b.weapons || {}).every(([weaponId, quantity]) => !!db.weapons[weaponId] && Number.isFinite(quantity) && quantity > 0), msg:`${id} weapon groups use existing weapons and positive quantities`});
        checks.push({ok: !["soft","hard","ap"].some(field => Object.hasOwn(b, field)), msg:`${id} stores attack and penetration in weapons, not the battalion`});
    }
    const allowedWeaponRoles = new Set(["direct_fire", "bombard", "airstrike"]);
    for (const [id, w] of Object.entries(db.weapons)) {
        checks.push({ok: Number.isInteger(w.generation) && w.generation >= 0, msg:`${id} has a non-negative whole-number weapon generation`});
        checks.push({ok: typeof w.indirect_fire === "boolean", msg:`${id} declares direct or indirect fire`});
        checks.push({ok: Array.isArray(w.roles) && w.roles.length > 0 && w.roles.every(role => allowedWeaponRoles.has(role)), msg:`${id} has valid mission roles`});
        const bands = Array.isArray(w.range_bands) ? w.range_bands : [];
        checks.push({ok: bands.length > 0, msg:`${id} has at least one range band`});
        checks.push({ok: bands.every((band, index) => Number.isFinite(band.max_range_km) && band.max_range_km > (index ? bands[index - 1].max_range_km : 0) && [band.soft_attack, band.hard_attack, band.armor_piercing].every(value => Number.isFinite(value) && value >= 0)), msg:`${id} range bands are ordered and contain non-negative attack data`});
        checks.push({ok: !w.roles?.includes("bombard") || w.indirect_fire === true, msg:`${id} uses indirect fire when assigned the bombard role`});
    }
    checks.push(...validateScenarioAuthoring(db));
    if (showAlert) alert(checks.map(c => `${c.ok ? tr("OK", "通过") : tr("FIX", "修复")} - ${editorCheckMessage(c)}`).join("\n"));
    return checks;
}

async function loadTemplate(confirmReplace=true) {
    if (confirmReplace && !confirm(tr("Replace current editor data with the default crisis template?", "是否用默认危机剧本模板替换当前编辑内容？"))) return;
    try {
        const response = await fetch('/api/editor_template');
        const data = await response.json();
        if (!response.ok || data.status !== 'ok') throw new Error((editorIsChinese() && data.msg_zh) || data.msg || tr(`Request failed (${response.status})`, `请求失败（${response.status}）`));
        db = initializePackageAuthoring({scenario:data.scenario, units:data.units, battalions:data.battalions, weapons:data.weapons, rules:data.rules, doctrine:data.doctrine, package:data.package, objectives:data.objectives, events:data.events});
        mapFiles = { dem: [], roads: null, rivers: null, provinces: null };
        render();
    } catch (error) {
        byId("content").innerHTML = `<div class="section"><h2 style="color:#ff7b72;">${tr("Starter package failed to load", "剧本包模板载入失败")}</h2><p>${esc(error.message)}</p></div>`;
    }
}

async function exportAll() {
    await exportScenarioPackage();
}

applyEditorLanguage();
render();
loadTemplate(false);
</script>
