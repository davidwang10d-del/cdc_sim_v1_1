<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CDC DLC Builder</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <style>
        body { margin:0; background:#050a0f; color:#c9d1d9; font-family:"Segoe UI", Arial, sans-serif; overflow:hidden; user-select:text; }
        #header { height:58px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; background:#0d1117; border-bottom:1px solid #30363d; }
        #workspace { display:grid; grid-template-columns:260px 1fr; height:calc(100vh - 59px); }
        #sidebar { background:#0d1117; border-right:1px solid #30363d; padding:12px; overflow-y:auto; }
        #content { overflow-y:auto; padding:22px; }
        .nav-btn { width:100%; text-align:left; margin-bottom:7px; padding:10px; border:1px solid #30363d; background:#010409; color:#c9d1d9; border-radius:4px; cursor:pointer; }
        .nav-btn.active { border-color:#58a6ff; color:#58a6ff; background:#1f6feb20; }
        .section { border:1px solid #30363d; background:#0d1117; border-radius:6px; padding:16px; margin-bottom:16px; }
        .section h2 { margin:0 0 10px; color:#58a6ff; font-size:18px; }
        .hint { color:#8b949e; font-size:12px; line-height:1.45; margin-bottom:12px; }
        .grid { display:grid; grid-template-columns:repeat(2, minmax(220px, 1fr)); gap:12px; }
        .grid.three { grid-template-columns:repeat(3, minmax(180px, 1fr)); }
        label { color:#8b949e; font-size:12px; font-weight:600; display:block; margin-bottom:4px; }
        input, select, textarea { width:100%; box-sizing:border-box; background:#010409; color:#c9d1d9; border:1px solid #30363d; border-radius:4px; padding:8px; font-family:inherit; }
        textarea { min-height:76px; resize:vertical; }
        .btn { border:1px solid #2ea043; background:#238636; color:#fff; border-radius:4px; padding:8px 12px; cursor:pointer; font-weight:600; }
        .btn.secondary { background:#1f6feb; border-color:#58a6ff; }
        .btn.warn { background:#9a6700; border-color:#e3b341; }
        .btn.danger { background:#da3633; border-color:#f85149; }
        .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
        .card { border:1px solid #30363d; background:#010409; padding:12px; border-radius:5px; margin-bottom:10px; }
        .card-title { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
        .small { font-size:12px; color:#8b949e; }
        .pill { display:inline-block; border:1px solid #30363d; border-radius:999px; padding:2px 8px; margin:2px; color:#8b949e; font-size:11px; }
        .zh-only { display:none; }
        body.zh .en-only { display:none; }
        body.zh .zh-only { display:inline; }
    </style>
</head>
<body>
<div id="header">
    <div>
        <div style="font-size:20px; font-weight:700; color:#fff;">CDC DLC Builder <span class="zh-only">/ 剧本生成器</span></div>
        <div class="small">No-code scenario package creator for MUN chairs / 面向主席团的无代码剧本工具</div>
    </div>
    <div class="toolbar" style="margin:0;">
        <button class="btn secondary" onclick="toggleLanguage()">EN / 中文</button>
        <button class="btn warn" onclick="loadTemplate('crisis')">Load Crisis Template</button>
        <button class="btn secondary" onclick="validateDlc()">Check Package</button>
        <button class="btn" onclick="exportAll()">Export DLC Zip</button>
    </div>
</div>

<div id="workspace">
    <div id="sidebar">
        <button class="nav-btn active" onclick="switchTab('start', this)">1. Start / 开始</button>
        <button class="nav-btn" onclick="switchTab('scenario', this)">2. Scenario & Map / 剧本地图</button>
        <button class="nav-btn" onclick="switchTab('rules', this)">3. Simulation Rules / 推演规则</button>
        <button class="nav-btn" onclick="switchTab('committee', this)">4. Committee / 委员会</button>
        <button class="nav-btn" onclick="switchTab('diplomacy', this)">5. Diplomacy / 外交阵营</button>
        <button class="nav-btn" onclick="switchTab('units', this)">6. Units / 部队</button>
        <button class="nav-btn" onclick="switchTab('battalions', this)">7. Battalion Types / 营种</button>
        <button class="nav-btn" onclick="switchTab('weapons', this)">8. Weapons / 武器</button>
        <button class="nav-btn" onclick="switchTab('export', this)">9. Export / 导出</button>
    </div>
    <div id="content"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
let db = null;

let currentTab = "start";
let mapFiles = { dem: [], roads: null, rivers: null, provinces: null };

function byId(id) { return document.getElementById(id); }
function esc(value) { return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;"); }
function n(value, fallback=0) { const parsed = parseFloat(value); return Number.isFinite(parsed) ? parsed : fallback; }
function validId(value) { return /^[A-Za-z0-9_][A-Za-z0-9_.-]{0,63}$/.test(value || ""); }
function switchTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
    if (btn) btn.classList.add("active");
    render();
}
function toggleLanguage() { document.body.classList.toggle("zh"); }
function setPath(obj, path, value) {
    const parts = path.split(".");
    let target = obj;
    while (parts.length > 1) target = target[parts.shift()];
    target[parts[0]] = value;
}
function input(label, path, value, type="text", step="") {
    const sync = path.startsWith("rules.") ? "; syncRulesJson()" : "";
    return `<div><label>${label}</label><input type="${type}" ${step ? `step="${step}"` : ""} value="${esc(value)}" onchange="setPath(db, '${path}', this.type==='number' ? n(this.value) : this.value)${sync}"></div>`;
}
function textarea(label, path, value) {
    return `<div style="grid-column:1/-1;"><label>${label}</label><textarea onchange="setPath(db, '${path}', this.value)">${esc(value)}</textarea></div>`;
}
function render() {
    if (!db) {
        byId("content").innerHTML = `<div class="section"><h2>Loading DLC starter package…</h2></div>`;
        return;
    }
    const renders = { start: renderStart, scenario: renderScenario, rules: renderRules, committee: renderCommittee, diplomacy: renderDiplomacy, units: renderUnits, battalions: renderBattalions, weapons: renderWeapons, export: renderExport };
    byId("content").innerHTML = renders[currentTab]();
}

function renderStart() {
    return `<div class="section">
        <h2>Chair-Friendly DLC Builder <span class="zh-only">/ 主席团无代码 DLC 生成器</span></h2>
        <p class="hint">Fill the tabs from top to bottom. Export creates battle data and special simulation rules that run on the simulator's shared command doctrine.</p>
        <div class="grid">
            <div class="card"><b>1. Scenario & Map</b><p class="small">Name the committee and define map bounds.</p></div>
            <div class="card"><b>2. Simulation Rules</b><p class="small">Tune clock, readiness, detection, combat, missions, routing, and political influence.</p></div>
            <div class="card"><b>3. Committee</b><p class="small">Add delegate roles, procedure, victory conditions, and staff notes.</p></div>
            <div class="card"><b>4. Diplomacy</b><p class="small">Group factions that start as allies.</p></div>
            <div class="card"><b>5. Units</b><p class="small">Place battle units using DLC-defined types and core combat stances.</p></div>
            <div class="card"><b>6. Battalion Types</b><p class="small">Define combat, recon, logistics, and capability data.</p></div>
            <div class="card"><b>7. Weapons</b><p class="small">Define weapon ranges and direct or indirect fire.</p></div>
        </div>
        <div class="section"><h2>Map File Rules</h2>
        <p class="hint">Optional map files can be attached in Scenario & Map. DEM files are placed in <code>maps/dem_tiles</code>. Roads, rivers, and province files are placed in <code>maps</code>.</p></div>
    </div>`;
}

function renderScenario() {
    const s = db.scenario, b = s.map_config.bounds;
    return `<div class="section"><h2>Scenario & Map / 剧本与地图</h2>
        <div class="grid">
            ${input("Scenario Name / 剧本名称", "scenario.scenario_name", s.scenario_name)}
            ${input("Description / 简介", "scenario.description", s.description)}
            ${input("Map Center Latitude / 地图中心纬度", "scenario.map_center.0", s.map_center[0], "number", "0.001")}
            ${input("Map Center Longitude / 地图中心经度", "scenario.map_center.1", s.map_center[1], "number", "0.001")}
            ${input("Map Zoom / 地图缩放", "scenario.map_zoom", s.map_zoom, "number", "1")}
            ${input("Grid Width / 网格宽", "scenario.map_config.grid_resolution.0", s.map_config.grid_resolution[0], "number", "1")}
            ${input("Grid Height / 网格高", "scenario.map_config.grid_resolution.1", s.map_config.grid_resolution[1], "number", "1")}
            ${input("DEM Analysis Width / 高程分析宽", "scenario.map_config.dem_analysis_resolution.0", s.map_config.dem_analysis_resolution?.[0] || 1200, "number", "1")}
            ${input("DEM Analysis Height / 高程分析高", "scenario.map_config.dem_analysis_resolution.1", s.map_config.dem_analysis_resolution?.[1] || 1200, "number", "1")}
            ${input("Min Lon / 最小经度", "scenario.map_config.bounds.min_lon", b.min_lon, "number", "0.001")}
            ${input("Max Lon / 最大经度", "scenario.map_config.bounds.max_lon", b.max_lon, "number", "0.001")}
            ${input("Min Lat / 最小纬度", "scenario.map_config.bounds.min_lat", b.min_lat, "number", "0.001")}
            ${input("Max Lat / 最大纬度", "scenario.map_config.bounds.max_lat", b.max_lat, "number", "0.001")}
            ${input("Province Name Property / 省名字段", "scenario.map_config.province_name_property", s.map_config.province_name_property || "")}
            ${input("Fallback Elevation m / 默认海拔", "scenario.map_config.fallback_elevation_m", s.map_config.fallback_elevation_m ?? 0, "number", "1")}
        </div>
    </div>
    <div class="section"><h2>Optional Map Files / 可选地图文件</h2>
        <p class="hint">You may export a playable DLC without map files. The simulator will use fallback terrain. For serious committees, add DEM/province/road files.</p>
        <div class="grid">
            <div><label>DEM tiles (.tif, multiple) / 高程瓦片</label><input type="file" multiple accept=".tif,.tiff" onchange="mapFiles.dem = Array.from(this.files)"></div>
            <div><label>Road raster/vector / 道路文件</label><input type="file" accept=".tif,.tiff,.geojson,.json" onchange="mapFiles.roads = this.files[0] || null"></div>
            <div><label>River geojson / 河流文件</label><input type="file" accept=".geojson,.json" onchange="mapFiles.rivers = this.files[0] || null"></div>
            <div><label>Province geojson / 省界文件</label><input type="file" accept=".geojson,.json" onchange="mapFiles.provinces = this.files[0] || null"></div>
        </div>
    </div>`;
}

function renderRules() {
    const r = db.rules;
    const stanceNames = Object.values(db.doctrine.stances).map(profile => profile.label).join(", ");
    const orderNames = Object.values(db.doctrine.orders.modes).map(profile => profile.label).join(", ");
    return `<div class="section"><h2>Simulation Rules / 推演规则</h2>
        <p class="hint">These are scenario-specific values. Tactical orders, combat stances, and their interaction are shared core doctrine and are not duplicated in a DLC.</p>
        <div class="card"><b>Core doctrine (read only)</b><p class="small">Orders: ${esc(orderNames)}</p><p class="small">Stances: ${esc(stanceNames)}</p></div>
        <div class="grid three">
            ${input("Game seconds per real second", "rules.clock.game_seconds_per_real_second", r.clock.game_seconds_per_real_second, "number", "0.1")}
            ${input("Minimum speed multiplier", "rules.clock.speed_multiplier_min", r.clock.speed_multiplier_min, "number", "0.1")}
            ${input("Maximum speed multiplier", "rules.clock.speed_multiplier_max", r.clock.speed_multiplier_max, "number", "0.1")}
            ${input("Detection probability scale", "rules.detection.probability_scale", r.detection.probability_scale, "number", "0.1")}
            ${input("Contact memory hours", "rules.detection.contact_ttl_hours", r.detection.contact_ttl_hours, "number", "0.1")}
            ${input("Direct combat attack scale", "rules.combat.direct.attack_scale", r.combat.direct.attack_scale, "number", "0.01")}
            ${input("Routing morale threshold", "rules.combat.routing.morale_threshold", r.combat.routing.morale_threshold, "number", "1")}
            ${input("Bombard casualty coefficient", "rules.missions.bombard.casualty_coefficient", r.missions.bombard.casualty_coefficient, "number", "0.0001")}
            ${input("Airstrike casualty coefficient", "rules.missions.airstrike.casualty_coefficient", r.missions.airstrike.casualty_coefficient, "number", "0.01")}
            ${input("Influence shift per hour", "rules.political_influence.shift_per_reference_unit_hour", r.political_influence.shift_per_reference_unit_hour, "number", "0.1")}
        </div>
    </div>
    <div class="section"><h2>Advanced Rules JSON</h2>
        <p class="hint">Edit the DLC contract here to add battle-specific unit types, capabilities, or detailed coefficients. Core orders and stances cannot be overridden.</p>
        <textarea id="rules-json" style="min-height:520px; font-family:Consolas, monospace;">${esc(JSON.stringify(r, null, 2))}</textarea>
        <div class="toolbar" style="margin-top:10px;"><button class="btn secondary" onclick="applyRulesJson()">Apply Advanced JSON</button></div>
    </div>`;
}

function syncRulesJson() {
    const editor = byId("rules-json");
    if (editor) editor.value = JSON.stringify(db.rules, null, 2);
}

function applyRulesJson() {
    try {
        const parsed = JSON.parse(byId("rules-json").value);
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) throw new Error("Rules root must be an object.");
        if (parsed.schema_version !== 1) throw new Error("schema_version must be 1.");
        const requiredObjects = ["clock", "unit_defaults", "unit_types", "detection", "combat", "missions", "political_influence"];
        for (const key of requiredObjects) {
            if (!parsed[key] || typeof parsed[key] !== "object" || Array.isArray(parsed[key])) throw new Error(`Missing required object: ${key}`);
        }
        if (parsed.orders || parsed.stances) throw new Error("orders and stances belong to core doctrine and must not be stored in rules.json.");
        if (!parsed.combat.direct || !parsed.combat.routing || !parsed.missions.bombard || !parsed.missions.airstrike) throw new Error("Combat and mission rule sections are incomplete.");
        db.rules = parsed;
        alert("Rules JSON applied. Run Check Package before export.");
        render();
    } catch (error) {
        alert("Rules JSON rejected: " + error.message);
    }
}

function renderCommittee() {
    const c = db.scenario.committee;
    return `<div class="section"><h2>Committee Settings / 委员会设置</h2><div class="grid">
        ${input("Committee Name / 委员会名称", "scenario.committee.committee_name", c.committee_name)}
        ${input("Committee Type / 委员会类型", "scenario.committee.committee_type", c.committee_type)}
        ${input("Simulation Scope / 推演范围", "scenario.committee.simulation_scope", c.simulation_scope)}
        ${input("Start Date or Turn / 起始日期", "scenario.committee.start_date", c.start_date)}
        ${input("Chair Visibility / 主席可见性", "scenario.committee.chair_visibility", c.chair_visibility)}
        ${input("Delegate Visibility / 代表可见性", "scenario.committee.delegate_visibility", c.delegate_visibility)}
        ${textarea("Public Briefing / 公开背景", "scenario.committee.public_briefing", c.public_briefing)}
        ${textarea("Staff Notes / 主席团私密备注", "scenario.committee.staff_notes", c.staff_notes)}
    </div></div>
    ${renderStringList("Rules of Engagement / 议事与交战规则", c.rules_of_engagement, "rules_of_engagement")}
    ${renderStringList("Victory Conditions / 胜利目标", c.victory_conditions, "victory_conditions")}
    ${renderRoles()}`;
}

function renderStringList(title, list, key) {
    return `<div class="section"><h2>${title}</h2><div class="toolbar"><button class="btn secondary" onclick="db.scenario.committee.${key}.push('New item'); render()">Add</button></div>
        ${list.map((item, i) => `<div class="card"><div class="grid"><input value="${esc(item)}" onchange="db.scenario.committee.${key}[${i}] = this.value"><button class="btn danger" onclick="db.scenario.committee.${key}.splice(${i},1); render()">Delete</button></div></div>`).join("")}
    </div>`;
}

function renderRoles() {
    const roles = db.scenario.committee.delegate_roles;
    return `<div class="section"><h2>Delegate Roles / 代表角色</h2><div class="toolbar"><button class="btn secondary" onclick="rolesAdd()">Add Role</button></div>
        ${roles.map((r, i) => `<div class="card"><div class="card-title"><b>${esc(r.faction || "Faction")}</b><button class="btn danger" onclick="db.scenario.committee.delegate_roles.splice(${i},1); render()">Delete</button></div>
            <div class="grid">${roleInput(i, "faction", r.faction, "Faction / 阵营")}${roleInput(i, "role", r.role, "Role / 角色")}${roleInput(i, "briefing", r.briefing, "Briefing / 简报")}</div></div>`).join("")}
    </div>`;
}
function roleInput(i, key, value, label) { return `<div><label>${label}</label><input value="${esc(value)}" onchange="db.scenario.committee.delegate_roles[${i}].${key}=this.value"></div>`; }
function rolesAdd() { db.scenario.committee.delegate_roles.push({faction:"NEW_FACTION", role:"Delegate Role", briefing:"Private role briefing."}); render(); }

function renderDiplomacy() {
    return `<div class="section"><h2>Diplomacy Blocs / 外交阵营</h2><p class="hint">Members inside the same bloc begin allied. Put faction names separated by commas.</p>
    <div class="toolbar"><button class="btn secondary" onclick="db.scenario.diplomacy_blocs.push({bloc_name:'New Bloc', members:['Faction A']}); render()">Add Bloc</button></div>
    ${db.scenario.diplomacy_blocs.map((b, i) => `<div class="card"><div class="grid">
        <div><label>Bloc Name / 阵营名</label><input value="${esc(b.bloc_name)}" onchange="db.scenario.diplomacy_blocs[${i}].bloc_name=this.value"></div>
        <div><label>Members / 成员</label><input value="${esc(b.members.join(', '))}" onchange="db.scenario.diplomacy_blocs[${i}].members=this.value.split(',').map(x=>x.trim()).filter(Boolean)"></div>
        <button class="btn danger" onclick="db.scenario.diplomacy_blocs.splice(${i},1); render()">Delete</button>
    </div></div>`).join("")}</div>`;
}

function renderUnits() {
    return `<div class="section"><h2>Units / 部队</h2><div class="toolbar"><button class="btn secondary" onclick="addUnit()">Add Unit</button></div>
        ${Object.entries(db.units).map(([id, u]) => renderUnitCard(id, u)).join("")}</div>`;
}
function renderUnitCard(id, u) {
    const stanceOptions = Object.entries(db.doctrine.stances).map(([v, profile]) => `<option value="${v}" ${u.stance===v?"selected":""}>${esc(profile.label || v)}</option>`).join("");
    const typeOptions = Object.entries(db.rules.unit_types).map(([v, profile]) => `<option value="${v}" ${u.unit_type===v?"selected":""}>${esc(profile.label || v)}</option>`).join("");
    const weaponOptions = Object.keys(db.weapons).map(w => `<option value="${w}" ${u.primary_weapon===w?"selected":""}>${w}</option>`).join("");
    const comp = Object.keys(db.battalions).map(b => `<div><label>${db.battalions[b].name} (${b})</label><input type="number" value="${u.composition?.[b] || 0}" onchange="setComp('${id}','${b}', n(this.value))"></div>`).join("");
    return `<div class="card"><div class="card-title"><b>${esc(u.name)} <span class="pill">${id}</span></b><button class="btn danger" onclick="delete db.units['${id}']; render()">Delete</button></div>
        <div class="grid three">
            ${unitInput(id,"name",u.name,"Name / 名称")}${unitInput(id,"faction",u.faction,"Faction / 阵营")}${unitInput(id,"icon",u.icon || "","Icon text / 图标文字")}
            ${unitInput(id,"personnel",u.personnel,"Personnel / 人数","number","1")}${unitInput(id,"equipment_level",u.equipment_level,"Equipment Level / 装备水平","number","0.1")}${unitInput(id,"morale",u.morale,"Morale / 士气","number","1")}
            ${unitInput(id,"lon",u.lon,"Longitude / 经度","number","0.001")}${unitInput(id,"lat",u.lat,"Latitude / 纬度","number","0.001")}${unitInput(id,"entrenchment",u.entrenchment || 0,"Entrenchment / 工事","number","0.1")}
            <div><label>Unit Type / 单位类型</label><select onchange="db.units['${id}'].unit_type=this.value">${typeOptions}</select></div>
            <div><label>Primary Weapon / 主武器</label><select onchange="db.units['${id}'].primary_weapon=this.value">${weaponOptions}</select></div>
            <div><label>Default Stance / 默认姿态</label><select onchange="db.units['${id}'].stance=this.value">${stanceOptions}</select></div>
        </div>
        <h3 class="small">Composition / 编成</h3><div class="grid three">${comp}</div>
    </div>`;
}
function unitInput(id, key, value, label, type="text", step="") { return `<div><label>${label}</label><input type="${type}" ${step ? `step="${step}"` : ""} value="${esc(value)}" onchange="db.units['${id}'].${key}=this.type==='number'?n(this.value):this.value"></div>`; }
function setComp(id, b, value) { if (!db.units[id].composition) db.units[id].composition = {}; if (value > 0) db.units[id].composition[b] = value; else delete db.units[id].composition[b]; }
function addUnit() {
    const id = "unit_" + Date.now().toString().slice(-8);
    const battalionId = Object.keys(db.battalions)[0];
    const weaponId = Object.keys(db.weapons)[0];
    if (!battalionId || !weaponId) { alert("Create at least one battalion and weapon first."); return; }
    const center = db.scenario.map_center || [0, 0];
    const faction = db.scenario.committee?.delegate_roles?.[0]?.faction || "FACTION";
    const size = n(db.battalions[battalionId].size, 0);
    if (!Number.isInteger(size) || size <= 0) { alert("Set a positive whole-number battalion size before creating a unit."); return; }
    const defaults = db.rules.unit_defaults;
    db.units[id] = {name:"New Unit", faction, icon:"", personnel:size, lon:center[1], lat:center[0], equipment_level:defaults.equipment_level, unit_type:defaults.unit_type, composition:{[battalionId]:1}, primary_weapon:weaponId, morale:defaults.morale, stance:defaults.stance, entrenchment:defaults.entrenchment};
    render();
}

function renderBattalions() {
    return `<div class="section"><h2>Battalion Types / 营种数据</h2><p class="hint">These define the building blocks chairs choose when creating units. Size is required and must be a positive whole-number personnel complement.</p><div class="toolbar"><button class="btn secondary" onclick="addBattalion()">Add Battalion Type</button></div>
        ${Object.entries(db.battalions).map(([id, b]) => `<div class="card"><div class="card-title"><b>${esc(b.name)} <span class="pill">${id}</span></b><button class="btn danger" onclick="delete db.battalions['${id}']; render()">Delete</button></div><div class="grid three">
            ${batInput(id,"name",b.name,"Name / 名称")}${batInput(id,"size",b.size ?? 1000,"Personnel per Battalion / 每营人数","number","1","1")}${batInput(id,"speed",b.speed,"Speed km/h / 速度","number","0.1")}
            ${batInput(id,"soft",b.soft,"Soft Attack / 对软目标","number","1")}${batInput(id,"hard",b.hard,"Hard Attack / 对装甲","number","1")}${batInput(id,"ap",b.ap || 0,"Armor Piercing / 穿甲","number","1")}
            ${batInput(id,"armor",b.armor,"Armor / 装甲","number","1")}${batInput(id,"defense",b.defense,"Defense / 防御","number","1")}${batInput(id,"breakthrough",b.breakthrough || 0,"Breakthrough / 突破","number","1")}
            ${batInput(id,"org",b.org,"Organization / 组织度","number","1")}${batInput(id,"softness",b.softness ?? 1,"Softness 0-1 / 软目标比例","number","0.1")}${batInput(id,"terrain",b.terrain,"Terrain Efficiency / 地形适应","number","0.1")}
            ${batInput(id,"recon_power",b.recon_power,"Recon Power / 侦察值","number","0.1")}${batInput(id,"movement_supply_cost",b.movement_supply_cost,"Movement Supply Cost / 机动补给消耗","number","0.01")}
            <div><label>Capabilities / 能力（comma separated）</label><input value="${esc((b.capabilities || []).join(', '))}" onchange="db.battalions['${id}'].capabilities=this.value.split(',').map(x=>x.trim()).filter(Boolean)"></div>
        </div></div>`).join("")}</div>`;
}
function batInput(id, key, value, label, type="text", step="", min="") { return `<div><label>${label}</label><input type="${type}" ${step ? `step="${step}"` : ""} ${min ? `min="${min}"` : ""} value="${esc(value)}" onchange="db.battalions['${id}'].${key}=this.type==='number'?n(this.value):this.value"></div>`; }
function addBattalion() {
    const id = prompt("Battalion ID (letters, numbers, underscore, dash, or dot)");
    if (!id) return;
    if (!validId(id) || db.battalions[id]) { alert("Invalid or duplicate battalion ID."); return; }
    db.battalions[id] = {name:"New Battalion", size:1000, speed:0, soft:0, hard:0, ap:0, armor:0, defense:0, breakthrough:0, org:0, softness:1, terrain:1, recon_power:0, movement_supply_cost:0, capabilities:[]};
    render();
}

function renderWeapons() {
    return `<div class="section"><h2>Weapons / 武器射程</h2><div class="toolbar"><button class="btn secondary" onclick="addWeapon()">Add Weapon</button></div>
        ${Object.entries(db.weapons).map(([id, w]) => `<div class="card"><div class="grid"><div><label>ID</label><input value="${esc(id)}" readonly></div><div><label>Name / 名称</label><input value="${esc(w.name)}" onchange="db.weapons['${id}'].name=this.value"></div><div><label>Range km / 射程</label><input type="number" step="0.1" value="${w.range}" onchange="db.weapons['${id}'].range=n(this.value)"></div><div><label><input type="checkbox" style="width:auto;" ${w.indirect_fire ? "checked" : ""} onchange="db.weapons['${id}'].indirect_fire=this.checked"> Indirect fire / 间接射击</label></div><button class="btn danger" onclick="delete db.weapons['${id}']; render()">Delete</button></div></div>`).join("")}</div>`;
}
function addWeapon() {
    const id = prompt("Weapon ID (letters, numbers, underscore, dash, or dot)");
    if (!id) return;
    if (!validId(id) || db.weapons[id]) { alert("Invalid or duplicate weapon ID."); return; }
    db.weapons[id] = {name:"New Weapon", range:0, indirect_fire:false};
    render();
}

function renderExport() {
    const checks = validateDlc(false);
    return `<div class="section"><h2>Export / 导出</h2><p class="hint">Click Check Package first. Then export the zip. Unzip it into the project <code>dlc</code> folder and rename the folder to your committee ID.</p>
    <div class="toolbar"><button class="btn secondary" onclick="validateDlc()">Check Package</button><button class="btn" onclick="exportAll()">Export DLC Zip</button></div>
    <div class="card"><b>Package status</b><div>${checks.map(c => `<div style="color:${c.ok ? '#7ee787' : '#ff7b72'}">${c.ok ? 'OK' : 'FIX'} - ${c.msg}</div>`).join("")}</div></div></div>`;
}

function validateDlc(showAlert=true) {
    const checks = [];
    checks.push({ok: !!db.scenario.scenario_name, msg:"Scenario has a name"});
    checks.push({ok: Object.keys(db.units).length > 0, msg:"At least one unit exists"});
    checks.push({ok: Object.keys(db.battalions).length > 0, msg:"At least one battalion type exists"});
    checks.push({ok: Object.keys(db.weapons).length > 0, msg:"At least one weapon exists"});
    checks.push({ok: db.rules?.schema_version === 1, msg:"rules.json uses schema version 1"});
    checks.push({ok: !!db.rules?.unit_types?.[db.rules?.unit_defaults?.unit_type], msg:"Default unit type exists in rules"});
    checks.push({ok: !!db.doctrine?.stances?.[db.rules?.unit_defaults?.stance], msg:"Default stance exists in core doctrine"});
    const bounds = db.scenario.map_config?.bounds || {};
    checks.push({ok: [bounds.min_lon,bounds.max_lon,bounds.min_lat,bounds.max_lat].every(Number.isFinite) && bounds.min_lon < bounds.max_lon && bounds.min_lat < bounds.max_lat, msg:"Map bounds are valid"});
    checks.push({ok: Array.isArray(db.scenario.map_center) && db.scenario.map_center.length === 2 && db.scenario.map_center.every(Number.isFinite), msg:"Map center is valid"});
    for (const id of [...Object.keys(db.units), ...Object.keys(db.battalions), ...Object.keys(db.weapons)]) {
        checks.push({ok: validId(id), msg:`${id} is a safe package ID`});
    }
    for (const [id, u] of Object.entries(db.units)) {
        checks.push({ok: !!db.weapons[u.primary_weapon], msg:`${id} uses an existing weapon`});
        checks.push({ok: Object.keys(u.composition || {}).every(k => !!db.battalions[k]), msg:`${id} composition uses existing battalion IDs`});
        checks.push({ok: Number.isFinite(u.lon) && Number.isFinite(u.lat) && Number.isFinite(u.personnel) && u.personnel >= 0, msg:`${id} has valid coordinates and personnel`});
        checks.push({ok: !!db.rules?.unit_types?.[u.unit_type], msg:`${id} uses a unit type from rules.json`});
        checks.push({ok: !!db.doctrine?.stances?.[u.stance], msg:`${id} uses a core combat stance`});
    }
    for (const [id, b] of Object.entries(db.battalions)) {
        checks.push({ok: Number.isFinite(b.recon_power) && Number.isFinite(b.movement_supply_cost) && b.movement_supply_cost >= 0, msg:`${id} has recon and movement supply data`});
    }
    for (const [id, w] of Object.entries(db.weapons)) {
        checks.push({ok: typeof w.indirect_fire === "boolean", msg:`${id} declares direct or indirect fire`});
    }
    if (showAlert) alert(checks.map(c => `${c.ok ? 'OK' : 'FIX'} - ${c.msg}`).join("\n"));
    return checks;
}

async function loadTemplate(confirmReplace=true) {
    if (confirmReplace && !confirm("Replace current editor data with the default crisis template?")) return;
    try {
        const response = await fetch('/api/editor_template');
        const data = await response.json();
        if (!response.ok || data.status !== 'ok') throw new Error(data.msg || `Request failed (${response.status})`);
        db = {scenario:data.scenario, units:data.units, battalions:data.battalions, weapons:data.weapons, rules:data.rules, doctrine:data.doctrine};
        mapFiles = { dem: [], roads: null, rivers: null, provinces: null };
        render();
    } catch (error) {
        byId("content").innerHTML = `<div class="section"><h2 style="color:#ff7b72;">Starter package failed to load</h2><p>${esc(error.message)}</p></div>`;
    }
}

async function exportAll() {
    const failed = validateDlc(false).filter(c => !c.ok);
    if (failed.length && !confirm("Some checks failed. Export anyway?")) return;
    if (typeof JSZip === 'undefined') { alert("ZIP library unavailable. Connect to the internet and reload the editor."); return; }
    const zip = new JSZip();
    const scenario = JSON.parse(JSON.stringify(db.scenario));
    if (mapFiles.roads) scenario.map_config.roads_file = "maps/" + mapFiles.roads.name;
    if (mapFiles.rivers) scenario.map_config.rivers_file = "maps/" + mapFiles.rivers.name;
    if (mapFiles.provinces) scenario.map_config.provinces_file = "maps/" + mapFiles.provinces.name;
    if (mapFiles.dem.length) scenario.map_config.dem_dir = "maps/dem_tiles";
    zip.file("scenario.json", JSON.stringify(scenario, null, 2));
    zip.file("units.json", JSON.stringify(db.units, null, 2));
    zip.file("battalions.json", JSON.stringify(db.battalions, null, 2));
    zip.file("weapons.json", JSON.stringify(db.weapons, null, 2));
    zip.file("rules.json", JSON.stringify(db.rules, null, 2));
    for (const f of mapFiles.dem) zip.file("maps/dem_tiles/" + f.name, f);
    if (mapFiles.roads) zip.file("maps/" + mapFiles.roads.name, mapFiles.roads);
    if (mapFiles.rivers) zip.file("maps/" + mapFiles.rivers.name, mapFiles.rivers);
    if (mapFiles.provinces) zip.file("maps/" + mapFiles.provinces.name, mapFiles.provinces);
    const blob = await zip.generateAsync({type:"blob"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${scenario.scenario_name.replace(/[^a-z0-9]+/gi, "_").toLowerCase()}_dlc.zip`;
    a.click();
    URL.revokeObjectURL(a.href);
}

render();
loadTemplate(false);
</script>
</body>
</html>
